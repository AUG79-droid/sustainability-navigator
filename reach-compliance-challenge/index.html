<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The REACH Compliance Challenge</title></head><body style="margin:0;background:#f5f0e8;font-family:Arial,sans-serif"><div id="loading" style="min-height:100vh;display:grid;place-items:center;color:#18343b;font-weight:700">Loading The REACH Compliance Challenge…</div><script>(async()=>{const files=['part-01.txt', 'part-02.txt', 'part-03.txt', 'part-04.txt', 'part-05.txt', 'part-06.txt', 'part-07.txt', 'part-08.txt', 'part-09.txt', 'part-10.txt', 'part-11.txt'];try{const chunks=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const bin=atob(chunks.join(''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('loading').textContent='Unable to load the challenge. Please refresh. '+e.message;}})();</script></body></html>
