<script>(function(){const es=new URLSearchParams(location.search).get("hubLang")==="es";if(es){document.documentElement.lang="es";document.title="El Reto de Cumplimiento REACH";const e=document.getElementById("loading");if(e)e.textContent="Cargando El Reto de Cumplimiento REACH…";}})();</script>
<script>
function installReachMap(){
  if(typeof renderMap!=="function"||typeof state==="undefined"||typeof hotspots==="undefined"||typeof app==="undefined")return;
  const imageUrl="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Airbus_A400M_Atlas_%28code_EC-400%29_of_the_Spanish_Air_Force_at_RIAT_Fairford_12July2018_arp.jpg/1280px-Airbus_A400M_Atlas_%28code_EC-400%29_of_the_Spanish_Air_Force_at_RIAT_Fairford_12July2018_arp.jpg";
  const copy={
    es:{
      kicker:"PRÁCTICA 01",title:"Mapa químico heredado",
      intro:"Inspecciona cada aplicación resaltada en la zona ficticia de retrofit. El objetivo es comprender por qué existe cada química antes de decidir qué debe cambiar.",
      inspected:"inspeccionados",instruction:"Selecciona un punto numerado sobre la aeronave o su ficha correspondiente para abrir la nota de ingeniería.",
      heading:"A400M · 5 zonas de inspección",open:"Abrir nota de ingeniería",reviewed:"Inspeccionado",
      next:"Continuar con teoría REACH",alt:"Avión de transporte militar Airbus A400M visto de perfil en tierra.",
      credit:"Foto: Adrian Pingstone · Wikimedia Commons · dominio público",
      missing:"No se ha podido cargar la fotografía de la aeronave. Actualiza la página."
    },
    en:{
      kicker:"PRACTICAL 01",title:"Legacy Chemical Map",
      intro:"Inspect every highlighted application in the fictional retrofit zone. The objective is to understand why each chemistry exists before deciding what should change.",
      inspected:"inspected",instruction:"Select a numbered point on the aircraft or its matching card to open the engineering note.",
      heading:"A400M · 5 inspection zones",open:"Open engineering note",reviewed:"Inspected",
      next:"Continue to REACH theory",alt:"Airbus A400M military transport aircraft seen in side profile on the ground.",
      credit:"Photo: Adrian Pingstone · Wikimedia Commons · public domain",
      missing:"The aircraft photograph could not load. Please refresh the page."
    }
  };
  renderMap = function renderAircraftInspectionMap(){
    const tr=copy[document.documentElement.lang==="es"?"es":"en"];
    const selected=state._hotspot;
    const detail=selected?hotspots[selected]:null;
    const zones=Object.entries(hotspots);
    const pins=zones.map(([key,item],i)=>{
      const done=state.inspected.has(key);
      return `<button type="button" class="hotspot ${done?"done":""} ${selected===key?"active":""}" data-hotspot="${key}" aria-label="${i+1}. ${item[0]}" aria-pressed="${selected===key}" title="${item[0]}">${i+1}</button>`;
    }).join("");
    const cards=zones.map(([key,item],i)=>{
      const done=state.inspected.has(key);
      return `<button type="button" class="sn-inspect-card ${done?"done":""} ${selected===key?"active":""}" data-hotspot="${key}" aria-pressed="${selected===key}"><span class="sn-inspect-id">${i+1}</span><span class="sn-inspect-copy"><strong>${item[0]}</strong><small>${done?tr.reviewed:tr.open}</small></span></button>`;
    }).join("");
    app.innerHTML=`<section class="screen card pad sn-reach-inspection">${pageHeader("practice",tr.kicker,tr.title,tr.intro)}
      <div class="notice"><strong>${state.inspected.size}/5 ${tr.inspected}.</strong> ${tr.instruction}</div>
      <div class="aircraft-map sn-photo-map" role="group" aria-label="${tr.heading}">
        <img class="sn-aircraft-photo" src="${imageUrl}" alt="${tr.alt}" loading="eager" decoding="async">
        <span class="sn-map-heading">${tr.heading}</span>
        <span class="sn-photo-error" hidden>${tr.missing}</span>
        ${pins}
      </div>
      <p class="sn-photo-credit">${tr.credit}</p>
      <div class="sn-inspection-list">${cards}</div>
      ${detail?`<div class="detail-panel" aria-live="polite"><div class="eyebrow">${detail[0]}</div><h3>${detail[1]}</h3><p>${detail[2]}</p></div>`:""}
      ${navButton(tr.next,3,state.inspected.size<5)}</section>`;
    const image=app.querySelector(".sn-aircraft-photo");
    if(image)image.onerror=()=>{
      const msg=app.querySelector(".sn-photo-error");
      if(msg)msg.hidden=false;
    };
    app.querySelectorAll(".sn-reach-inspection [data-hotspot]").forEach(button=>{
      button.onclick=()=>{
        state._hotspot=button.dataset.hotspot;
        state.inspected.add(button.dataset.hotspot);
        render();
      };
    });
    bindNav();
  };
  if(state.phase===2)renderMap();
}
const snReachMapStyles = "\n.sn-reach-inspection .sn-photo-map{position:relative;display:block;width:100%;min-height:0!important;aspect-ratio:1280/768;margin:16px 0 0;padding:0!important;border-radius:18px;background:#aab8bf;overflow:hidden;isolation:isolate}\n.sn-reach-inspection .sn-aircraft-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}\n.sn-reach-inspection .sn-map-heading{position:absolute;top:14px;left:14px;z-index:2;padding:9px 13px;color:#fff;background:rgba(15,35,45,.84);border:1px solid rgba(255,255,255,.45);border-radius:9px;font-size:13px;font-weight:850;letter-spacing:.02em;box-shadow:0 4px 12px rgba(0,0,0,.18)}\n.sn-reach-inspection .sn-photo-error:not([hidden]){position:absolute;inset:auto 16px 16px;z-index:6;color:#fff;background:#7c3030;padding:15px;border-radius:9px;font-size:14px;font-weight:700}\n.sn-reach-inspection .sn-photo-map .hotspot{position:absolute;inset:auto;z-index:3;min-width:0!important;width:43px;height:43px;display:flex;align-items:center;justify-content:center;padding:0!important;border:3px solid #fff;border-radius:50%;background:#c06b31;color:#fff;font-size:18px;line-height:1;font-weight:900;text-align:center;transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgba(13,37,42,.25),0 5px 15px rgba(0,0,0,.38);transition:background .14s,box-shadow .14s,scale .14s}\n.sn-reach-inspection .sn-photo-map .hotspot:hover,.sn-reach-inspection .sn-photo-map .hotspot:focus-visible{z-index:5;scale:1.14;background:#164f54;box-shadow:0 0 0 7px rgba(255,255,255,.42),0 6px 16px rgba(0,0,0,.4)}\n.sn-reach-inspection .sn-photo-map .hotspot.done{background:#176f6b;border-color:#fff}\n.sn-reach-inspection .sn-photo-map .hotspot.done:after{content:none!important;display:none!important}\n.sn-reach-inspection .sn-photo-map .hotspot.active{box-shadow:0 0 0 6px #ffce71,0 5px 18px rgba(0,0,0,.45)}\n.sn-reach-inspection .sn-photo-map .hotspot[data-hotspot=\"conversion\"]{left:18%;top:58%;right:auto;bottom:auto}\n.sn-reach-inspection .sn-photo-map .hotspot[data-hotspot=\"primer\"]{left:34%;top:66%;right:auto;bottom:auto}\n.sn-reach-inspection .sn-photo-map .hotspot[data-hotspot=\"sealant\"]{left:53%;top:58%;right:auto;bottom:auto}\n.sn-reach-inspection .sn-photo-map .hotspot[data-hotspot=\"bonding\"]{left:42%;top:48%;right:auto;bottom:auto}\n.sn-reach-inspection .sn-photo-map .hotspot[data-hotspot=\"repair\"]{left:67%;top:59%;right:auto;bottom:auto}\n.sn-reach-inspection .sn-photo-credit{font-size:11px;line-height:1.4;color:#647076;margin:7px 2px 14px}\n.sn-reach-inspection .sn-inspection-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,232px),1fr));gap:10px;margin:0 0 18px}\n.sn-reach-inspection .sn-inspect-card{display:flex;align-items:flex-start;gap:12px;min-width:0;min-height:86px;text-align:left;padding:14px;border:1px solid #cccdc9;border-radius:13px;background:#fff;color:#17292d;box-shadow:0 4px 12px rgba(20,30,34,.04)}\n.sn-reach-inspection .sn-inspect-card:hover,.sn-reach-inspection .sn-inspect-card:focus-visible{border-color:#176f6b;box-shadow:0 0 0 3px rgba(23,111,107,.15)}\n.sn-reach-inspection .sn-inspect-card.done{background:#edf7f5;border-color:#83b9af}\n.sn-reach-inspection .sn-inspect-card.active{border:2px solid #b65f33;background:#fff9ed}\n.sn-reach-inspection .sn-inspect-id{flex:0 0 29px;width:29px;height:29px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#24505a;color:#fff;font-size:15px;font-weight:900}\n.sn-reach-inspection .sn-inspect-card.done .sn-inspect-id{background:#176f6b}\n.sn-reach-inspection .sn-inspect-copy{display:block;min-width:0}\n.sn-reach-inspection .sn-inspect-copy strong{display:block;font-size:13px;line-height:1.42;font-weight:850;overflow-wrap:anywhere}\n.sn-reach-inspection .sn-inspect-copy small{display:block;margin-top:6px;font-size:12px;line-height:1.3;color:#4d656a;font-weight:650}\n@media(max-width:550px){.sn-reach-inspection .sn-map-heading{top:9px;left:9px;padding:6px 9px;font-size:11px}.sn-reach-inspection .sn-photo-map .hotspot{width:32px;height:32px;font-size:13px;border-width:2px}.sn-reach-inspection .sn-inspect-card{min-height:64px}.sn-reach-inspection .sn-inspection-list{grid-template-columns:1fr}}\n";
function withHubReturn(html) {
  const lang = new URLSearchParams(location.search).get("hubLang") === "en" ? "en" : "es";
  const label = lang === "en" ? "Back to Sustainability Hub" : "Volver al Sustainability Hub";
  const switchLanguage = lang === "es" ? "en" : "es";
  const switchLabel = lang === "es" ? "Switch to English" : "Cambiar al español";
  const control = `<a class="sn-hub-return" href="../?lang=${lang}#applications" aria-label="${label}">← ${label}</a><a class="sn-language-switch" href="./?hubLang=${switchLanguage}" aria-label="${switchLabel}">${switchLanguage.toUpperCase()}</a><style>.sn-hub-return,.sn-language-switch{position:fixed;z-index:2147483647;top:12px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;background:#071b33;color:#fff!important;font:800 13px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 5px 18px rgba(0,0,0,.3)}.sn-hub-return{left:12px}.sn-language-switch{right:12px}.sn-hub-return:focus-visible,.sn-language-switch:focus-visible{outline:3px solid #63d4e7;outline-offset:3px}@media(max-width:600px){.sn-hub-return,.sn-language-switch{top:8px;padding:8px 11px;font-size:11px}.sn-hub-return{left:8px}.sn-language-switch{right:8px}}</style>`;
  const snReachInspectionUpgrade = '<style id="sn-reach-inspection-map-20261012">' + snReachMapStyles + '</style><script>(' + installReachMap.toString() + ')();<' + '/script>';
  const progress = `<script defer src="../catalogue-data.js"><\/script><script defer src="../learning-paths-data.js"><\/script><script defer src="../progress-model.js"><\/script><script defer src="../progress-store.js"><\/script><script defer src="../progress-service.js"><\/script><script defer src="../progress-bridge.js" data-resource-id="reach-compliance-challenge" data-completion-selector=".final-score"><\/script>`;
  if (/<body[^>]*>/i.test(html)) {
    const withControl = html.replace(/<body[^>]*>/i, match => match + control);
    return /<\/body>/i.test(withControl) ? withControl.replace(/<\/body>/i, snReachInspectionUpgrade + progress + "</body>") : withControl + progress;
  }
  return control + html + snReachInspectionUpgrade + progress;
}
(async () => {
  const selectedLanguage = new URLSearchParams(location.search).get("hubLang") === "es" ? "es" : "en";
  const files = ["part-01.txt", "part-02.txt", "part-03.txt", "part-04.txt", "part-05.txt", "part-06.txt", "part-07.txt", "part-08.txt", "part-09.txt", "part-10.txt", "part-11.txt"];
  try {
    const chunks = await Promise.all(files.map(file => fetch(file, { cache: "no-store" }).then(response => {
      if (!response.ok) throw new Error(`${file} ${response.status}`);
      return response.text();
    })));
    const binary = atob(chunks.join(""));
    const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html = await new Response(stream).text();
    const localised = selectedLanguage === "es" ? window.SNReachLocalize(html) : html;
    // The exercise must focus on the layer descriptions in both languages.
    const revisedCopy = localised
      .replace("You have already learned what each layer does. Now use the descriptions—not prior chemistry knowledge—to assemble the compatible fictional protection stack.", "You have already learned what each layer does. Now use the descriptions to assemble the compatible fictional protection system.")
      .replace("Ya has aprendido qué hace cada capa. Usa ahora las descripciones, no conocimientos previos de química, para ensamblar la pila ficticia compatible.", "Ya has aprendido qué hace cada capa. Usa ahora las descripciones para ensamblar el sistema de protección ficticio compatible.");
    document.open(); document.write(withHubReturn(revisedCopy)); document.close();
  } catch (error) {
    const es = new URLSearchParams(location.search).get("hubLang") === "es"; document.getElementById("loading").innerHTML = es ? `No se ha podido cargar el reto. Actualiza la página. <a href="../?lang=es#applications">Volver al Sustainability Hub</a>` : `Unable to load the challenge. Please refresh. <a href="../?lang=en#applications">Back to Sustainability Hub</a>`;
  }
})();
</script>
