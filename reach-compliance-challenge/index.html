<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The REACH Compliance Challenge</title></head>
<body style="margin:0;background:#f5f0e8;font-family:Arial,sans-serif">
<div id="loading" style="min-height:100vh;display:grid;place-items:center;color:#18343b;font-weight:700">Loading The REACH Compliance Challenge…</div>
<script src="spanish-translations.js?v=phase-6b-task-5a-final"></script>
<script>
function withHubReturn(html) {
  const lang = new URLSearchParams(location.search).get("hubLang") === "en" ? "en" : "es";
  const label = lang === "en" ? "Back to Sustainability Hub" : "Volver al Sustainability Hub";
  const switchLanguage = lang === "es" ? "en" : "es";
  const switchLabel = lang === "es" ? "Switch to English" : "Cambiar al español";
  const control = `<a class="sn-hub-return" href="../?lang=${lang}#applications" aria-label="${label}">← ${label}</a><a class="sn-language-switch" href="./?hubLang=${switchLanguage}" aria-label="${switchLabel}">${switchLanguage.toUpperCase()}</a><style>.sn-hub-return,.sn-language-switch{position:fixed;z-index:2147483647;top:12px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;background:#071b33;color:#fff!important;font:800 13px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 5px 18px rgba(0,0,0,.3)}.sn-hub-return{left:12px}.sn-language-switch{right:12px}.sn-hub-return:focus-visible,.sn-language-switch:focus-visible{outline:3px solid #63d4e7;outline-offset:3px}@media(max-width:600px){.sn-hub-return,.sn-language-switch{top:8px;padding:8px 11px;font-size:11px}.sn-hub-return{left:8px}.sn-language-switch{right:8px}}</style>`;
  const progress = `<script defer src="../catalogue-data.js"><\/script><script defer src="../learning-paths-data.js"><\/script><script defer src="../progress-model.js"><\/script><script defer src="../progress-store.js"><\/script><script defer src="../progress-service.js"><\/script><script defer src="../progress-bridge.js" data-resource-id="reach-compliance-challenge" data-completion-selector=".final-score"><\/script>`;
  if (/<body[^>]*>/i.test(html)) {
    const withControl = html.replace(/<body[^>]*>/i, match => match + control);
    return /<\/body>/i.test(withControl) ? withControl.replace(/<\/body>/i, progress + "</body>") : withControl + progress;
  }
  return control + html + progress;
}
(async () => {
  const selectedLanguage = new URLSearchParams(location.search).get("hubLang") === "es" ? "es" : "en";
  const files = ["part-01.txt", "part-02.txt", "part-03.txt", "part-04.txt", "part-05.txt", "part-06.txt", "part-07.txt", "part-08.txt", "part-09.txt", "part-10.txt", "part-11.txt"];
  try {
    const chunks = await Promise.all(files.map(file => fetch(file, { cache: "no-store" }).then(response => {
      if (!response.ok) throw new Error(`${file} ${response.status}`);
      return response.text();
    })));
    const binary = atob(chunks.join(""));
    const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html = await new Response(stream).text();
    const localised = selectedLanguage === "es" ? window.SNReachLocalize(html) : html;
    document.open(); document.write(withHubReturn(localised)); document.close();
  } catch (error) {
    document.getElementById("loading").innerHTML = `Unable to load the challenge. Please refresh. ${error.message} <a href="../#applications">Back to Sustainability Hub</a>`;
  }
})();
</script>
</body>
</html>
