<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b32">
  <meta name="description" content="An accessible bilingual sustainability decision game for every employee. Fictional 15-year service scenario.">
  <title>Año 15 · El valor de lo que conservamos / Year 15</title>
  <link rel="stylesheet" href="./game.css?v=20261012-clear-purpose-v3">
</head>
<body>
  <div id="app">
    <div style="max-width:720px;margin:10vh auto;padding:36px;background:white;border-radius:22px;font:18px/1.6 Arial,sans-serif;color:#162a30">
      <h1>Year 15 / Año 15</h1>
      <p>Loading / Cargando…</p>
    </div>
  </div>
  <script src="./game.js?v=20261012-clear-purpose-v3"></script>
  <script>
    function withHubReturn() {
      var link = document.querySelector(".hub-link");
      if (!link) return;
      var language = new URLSearchParams(location.search).get("hubLang") === "en" ? "en" : "es";
      link.id = "sn-hub-return";
      link.href = "../?hubLang=" + language + "#applications";
      link.setAttribute("aria-label", language === "es" ? "Volver al catálogo de aplicaciones de Sustainability Navigator" : "Return to the Sustainability Navigator application catalogue");
    }
    withHubReturn();
  </script>
  <!-- Sustainability Navigator integration: completion is recorded locally when the final view appears. -->
  <script src="../catalogue-data.js"></script>
  <script src="../learning-paths-data.js"></script>
  <script src="../progress-model.js"></script>
  <script src="../progress-store.js"></script>
  <script src="../progress-service.js"></script>
  <script src="../progress-bridge.js" data-resource-id="year-15-challenge" data-completion-selector=".final-screen"></script>
</body>
</html>
