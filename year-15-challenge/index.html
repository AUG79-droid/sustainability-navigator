<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Year 15 Challenge</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f7f3eb;color:#20262d}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,100%);padding:32px;border:1px solid #d7cbbd;border-radius:22px;background:#fffdf8;text-align:center;box-shadow:0 18px 50px rgba(55,42,30,.10)}
.card b{display:block;font-size:22px;margin-bottom:8px}.card p{color:#59636b;line-height:1.5}.bar{height:6px;border-radius:99px;background:#e3dbd0;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:45%;background:#176b68;border-radius:99px;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-70%)}to{transform:translateX(190%)}}button{border:0;border-radius:12px;background:#176b68;color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><div class="card"><b>THE YEAR 15 CHALLENGE</b><p>Loading the approved Engineering &amp; Eco-Design experience…</p><div class="bar"><i></i></div></div></div>
<script>
(async()=>{
 try{
  const parts=[];
  for(let i=1;i<=9;i++){
    const r=await fetch(`.payload/part${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});
    if(!r.ok) throw new Error(`Payload part ${i} could not be loaded`);
    parts.push((await r.text()).trim());
  }
  const b64=parts.join('');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){
  document.getElementById('boot').innerHTML=`<div class="card"><b>THE YEAR 15 CHALLENGE</b><p>${e.message}</p><button onclick="location.reload()">RETRY</button></div>`;
 }
})();
</script>
</body>
</html>
