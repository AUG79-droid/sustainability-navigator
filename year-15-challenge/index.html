<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Year 15 Challenge</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f7f3eb;color:#20262d}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,100%);padding:32px;border:1px solid #d7cbbd;border-radius:22px;background:#fffdf8;text-align:center;box-shadow:0 18px 50px rgba(55,42,30,.10)}
.card b{display:block;font-size:22px;margin-bottom:8px}.card p{color:#59636b;line-height:1.5}.bar{height:6px;border-radius:99px;background:#e3dbd0;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:45%;background:#176b68;border-radius:99px;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{from{transform:translateX(-70%)}to{transform:translateX(190%)}}button{border:0;border-radius:12px;background:#176b68;color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div id="boot"><div class="card"><b>THE YEAR 15 CHALLENGE</b><p id="boot-copy">Loading the approved Engineering &amp; Eco-Design experience…</p><div class="bar"><i></i></div></div></div>
<script>(function(){const es=new URLSearchParams(location.search).get('hubLang')!=='en';if(es){document.documentElement.lang='es';const e=document.getElementById('boot-copy');if(e)e.textContent='Cargando la experiencia aprobada de Ingeniería y Ecodiseño…';}})();</script>
<script>
function withHubReturn(html){
 const lang=new URLSearchParams(location.search).get('hubLang')==='en'?'en':'es';
 const label=lang==='en'?'Back to Sustainability Hub':'Volver al Sustainability Hub';
 const control='<a class="sn-hub-return" href="../?lang='+lang+'#applications" aria-label="'+label+'">← '+label+'</a><style>.sn-hub-return{position:fixed;z-index:2147483647;top:12px;left:12px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;background:#071b33;color:#fff!important;font:800 13px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 5px 18px rgba(0,0,0,.3)}.sn-hub-return:focus-visible{outline:3px solid #63d4e7;outline-offset:3px}@media(max-width:600px){.sn-hub-return{top:8px;left:8px;padding:8px 11px;font-size:11px}}</style>';
 const localization='<script src="localization.js"><\/script>';
 const welcomeLayout='<style id="sn-year15-layout-fix">.sn-year15-real-welcome-card{height:190px!important;min-height:190px!important;max-height:190px!important;align-self:start!important;justify-self:stretch!important;overflow:visible!important;padding-top:22px!important;padding-bottom:22px!important;box-sizing:border-box!important}.sn-year15-real-welcome-card-parent{align-items:start!important;align-content:start!important}.sn-year15-welcome-chain{min-height:0!important;height:auto!important;max-height:none!important}@media(max-width:760px){.sn-year15-real-welcome-card{height:auto!important;min-height:150px!important;max-height:none!important;padding-top:18px!important;padding-bottom:18px!important}}</style><script>(function(){let done=false;function visibleStyle(el){const s=getComputedStyle(el),r=el.getBoundingClientRect(),radius=parseFloat(s.borderTopLeftRadius)||0,border=(parseFloat(s.borderTopWidth)||0)+(parseFloat(s.borderBottomWidth)||0),bg=s.backgroundColor||"";const visual=(radius>=8?3:0)+(border>0?3:0)+(s.boxShadow&&s.boxShadow!=="none"?2:0)+(!/rgba?\\(0, 0, 0, 0\\)|transparent/i.test(bg)?2:0);return{el,r,s,visual}}function fix(){if(done)return;const all=[...document.querySelectorAll("body *")];const h=all.find(el=>/^(Welcome|Bienvenida)$/i.test((el.textContent||"").trim()));if(!h)return;const options=[];let n=h;for(let depth=0;depth<12&&n&&n!==document.body;depth++,n=n.parentElement){const info=visibleStyle(n),txt=(n.textContent||"").replace(/\\s+/g," ").trim();if(info.r.width>430&&info.r.height>280&&/ARIA/i.test(txt)&&/(SHOW STEPS|MOSTRAR PASOS)/i.test(txt)&&!/SYSTEM LIFE-CYCLE|SYSTEM LIFE CYCLE/i.test(txt)){info.score=info.visual*100-depth*3-Math.abs(info.r.width-570)/20-Math.abs(info.r.height-500)/30;options.push(info)}}if(!options.length)return;options.sort((a,b)=>b.score-a.score);const card=options[0].el;card.classList.add("sn-year15-real-welcome-card");if(card.parentElement)card.parentElement.classList.add("sn-year15-real-welcome-card-parent");let x=h;while(x&&x!==card){x.classList.add("sn-year15-welcome-chain");x=x.parentElement}card.style.setProperty("height","190px","important");card.style.setProperty("min-height","190px","important");card.style.setProperty("max-height","190px","important");card.style.setProperty("align-self","start","important");card.style.setProperty("overflow","visible","important");done=true}function run(){fix();setTimeout(fix,120);setTimeout(fix,500);setTimeout(fix,1200)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run,{once:true});else run();const mo=new MutationObserver(()=>{fix();if(done)mo.disconnect()});mo.observe(document.documentElement,{subtree:true,childList:true});setTimeout(()=>mo.disconnect(),6000)})();<\/script>'
 const progress='<script src="../catalogue-data.js"><\/script><script src="../learning-paths-data.js"><\/script><script src="../progress-model.js"><\/script><script src="../progress-store.js"><\/script><script src="../progress-service.js"><\/script><script src="../progress-bridge.js" data-resource-id="year-15-challenge" data-completion-selector=".final-screen"><\/script>';
 return /<body[^>]*>/i.test(html)?html.replace(/<body[^>]*>/i,match=>match+control+localization+welcomeLayout+progress):control+localization+welcomeLayout+progress+html;
}
(async()=>{
 try{
  const parts=[];
  for(let i=1;i<=9;i++){
    const r=await fetch(`payload/part${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});
    if(!r.ok) throw new Error(`Payload part ${i} could not be loaded`);
    parts.push((await r.text()).trim());
  }
  const b64=parts.join('');
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(withHubReturn(html));document.close();
 }catch(e){
  const es=new URLSearchParams(location.search).get('hubLang')!=='en'; document.getElementById('boot').innerHTML=`<div class="card"><b>THE YEAR 15 CHALLENGE</b><p>${e.message}</p><button onclick="location.reload()">${es?'REINTENTAR':'RETRY'}</button><p><a href="../?lang=${es?'es':'en'}#applications">${es?'Volver al Sustainability Hub':'Back to Sustainability Hub'}</a></p></div>`;
 }
})();
</script>
</body>
</html>
