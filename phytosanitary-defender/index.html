<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phytosanitary Defender</title>
  <style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5efe7;color:#16252f}#loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:560px;background:#fffdf9;border:1px solid #ccb9a2;border-radius:24px;padding:28px;box-shadow:0 16px 36px rgba(31,37,41,.10)}.bar{height:10px;background:#eadfd2;border-radius:99px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:20%;background:#1c7069;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}</style>
</head>
<body>
<div id="loader"><div class="card"><h1>Phytosanitary Defender</h1><p>Loading the ISPM-15 challenge…</p><div class="bar"><i></i></div></div></div>
<script>
function withHubReturn(html) {
  const lang = new URLSearchParams(location.search).get("hubLang") === "en" ? "en" : "es";
  const label = lang === "en" ? "Back to Sustainability Hub" : "Volver al Sustainability Hub";
  const control = `<a class="sn-hub-return" href="../?lang=${lang}#applications" aria-label="${label}">← ${label}</a><style>.sn-hub-return{position:fixed;z-index:2147483647;top:12px;left:12px;padding:10px 14px;border:2px solid rgba(255,255,255,.75);border-radius:999px;background:#071b33;color:#fff!important;font:800 13px/1.2 system-ui,sans-serif;text-decoration:none;box-shadow:0 5px 18px rgba(0,0,0,.3)}.sn-hub-return:focus-visible{outline:3px solid #63d4e7;outline-offset:3px}@media(max-width:600px){.sn-hub-return{top:8px;left:8px;padding:8px 11px;font-size:11px}}</style>`;
  return /<body[^>]*>/i.test(html) ? html.replace(/<body[^>]*>/i, match => match + control) : control + html;
}
(async () => {
  try {
    const names = Array.from({ length: 9 }, (_, index) => `part-${String(index + 1).padStart(2, "0")}.txt`);
    const chunks = [];
    for (const name of names) {
      const response = await fetch(name, { cache: "no-store" });
      if (!response.ok) throw new Error(`${name}: ${response.status}`);
      chunks.push(await response.text());
    }
    document.open(); document.write(withHubReturn(chunks.join(""))); document.close();
  } catch (error) {
    document.getElementById("loader").innerHTML = `<div class="card"><h1>Loading error</h1><p>${String(error.message || error)}</p><p><a href="../#applications">Back to Sustainability Hub</a></p></div>`;
    console.error(error);
  }
})();
</script>
</body>
</html>
