<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phytosanitary Defender</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5efe7;color:#16252f}#loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{max-width:560px;background:#fffdf9;border:1px solid #ccb9a2;border-radius:24px;padding:28px;box-shadow:0 16px 36px rgba(31,37,41,.10)}.bar{height:10px;background:#eadfd2;border-radius:99px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:20%;background:#1c7069;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}</style></head><body><div id="loader"><div class="card"><h1>Phytosanitary Defender</h1><p>Loading the ISPM-15 challenge…</p><div class="bar"><i></i></div></div></div><script>(async()=>{try{const names=Array.from({length:9},(_,i)=>`part-${String(i+1).padStart(2,'0')}.txt`);const chunks=[];for(const n of names){const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(`${n}: ${r.status}`);chunks.push(await r.text());}const html=chunks.join('');document.open();document.write(html);document.close();}catch(e){document.getElementById('loader').innerHTML='<div class="card"><h1>Loading error</h1><p>'+String(e.message||e)+'</p><p>Please refresh the page.</p></div>';console.error(e);}})();</script></body></html>
