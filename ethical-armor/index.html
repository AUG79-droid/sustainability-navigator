<!doctype html><meta charset="utf-8"><title>Ethical Armor</title><body><p style="font-family:system-ui;padding:24px">Loading Ethical Armor…</p><script>(async()=>{const files=['part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt'];const parts=await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.open();document.write(parts.join(''));document.close();})().catch(e=>{document.body.innerHTML='<pre style="padding:24px">Unable to load Ethical Armor: '+e+'</pre>';});</script>
