name: Build Navigator patch artifact

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build repaired catalogue files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          catalogue_path = root / 'catalogue-data.js'
          catalogue = catalogue_path.read_text(encoding='utf-8')
          marker = '      resource("year-15-challenge"'
          if 'resource("aero-skills-launchpad"' not in catalogue:
              addition = '''      resource("aero-skills-launchpad", "course", "modular-digital-course",
                text("AeroSkills · Rendimiento ambiental en aviación", "AeroSkills · Aviation Environmental Performance"),
                text("Curso modular en inglés sobre desempeño ambiental en aviación, con evaluación de impactos de ciclo de vida, efectos climáticos, SAF, hidrógeno, eficiencia operacional, regulación y circularidad.", "An English modular course on aviation environmental performance covering life-cycle impacts, climate effects, SAF, hydrogen, operational efficiency, regulation and circularity."),
                text("Rendimiento ambiental y decisiones basadas en evidencia", "Environmental performance and evidence-based decisions"),
                ["engineering", "operations", "sustainability"], { en: pages("aero-skills-launchpad") }, null, "intermediate",
                ["P1", "P2", "P3", "P5", "P6"], [repository("aero-skills-launchpad", ["en"])]),

              resource("advanced-sustainability-air-power-services", "course", "advanced-digital-course",
                text("Sostenibilidad avanzada en Air Power In-Service", "Advanced Sustainability in Air Power In-Service"),
                text("Curso avanzado bilingüe de 15 módulos para integrar misión, seguridad, coste, disponibilidad y desempeño ambiental en decisiones de Air Power In-Service.", "A bilingual 15-module advanced course integrating mission, safety, cost, availability and environmental performance in Air Power In-Service decisions."),
                text("Sostenibilidad aplicada a decisiones In-Service", "Sustainability applied to In-Service decisions"),
                ["engineering", "operations", "managers", "sustainability"],
                { es: pages("advanced-sustainability-air-power-services"), en: pages("advanced-sustainability-air-power-services") }, null, "advanced",
                ["P1", "P2", "P3", "P4", "P5", "P6"], [repository("advanced-sustainability-air-power-services", ["es", "en"])], { noPriorExpertiseRequired: true }),

'''
              if marker not in catalogue:
                  raise SystemExit('Catalogue insertion marker not found')
              catalogue = catalogue.replace(marker, addition + marker, 1)
              catalogue_path.write_text(catalogue, encoding='utf-8')

          (root / 'governance' / 'inventory-data.cjs').write_text('''"use strict";\n\nmodule.exports = {\n  version: 1,\n  records: []\n};\n''', encoding='utf-8')

          app = root / 'app.js'
          text = app.read_text(encoding='utf-8')
          text = text.replace('explorar los 27 recursos.', 'explorar los 29 recursos.')
          text = text.replace('explore all 27 resources.', 'explore all 29 resources.')
          app.write_text(text, encoding='utf-8')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          text = text.replace('id="metric-learning-resources">26<', 'id="metric-learning-resources">29<')
          text = text.replace('id="metric-learning-resources">27<', 'id="metric-learning-resources">29<')
          text = text.replace('explorar los 26 recursos.', 'explorar los 29 recursos.')
          text = text.replace('explorar los 27 recursos.', 'explorar los 29 recursos.')
          text = text.replace('explore all 26 resources.', 'explore all 29 resources.')
          text = text.replace('explore all 27 resources.', 'explore all 29 resources.')
          index.write_text(text, encoding='utf-8')

          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8').replace('27 recursos', '29 recursos').replace('27 resources', '29 resources')
          readme.write_text(text, encoding='utf-8')

          checklist = root / 'VALIDATION_CHECKLIST.md'
          text = checklist.read_text(encoding='utf-8').replace('exactly 27 approved public logical resources', 'exactly 29 approved public logical resources')
          checklist.write_text(text, encoding='utf-8')

          tests = root / 'tests' / 'catalogue.test.cjs'
          text = tests.read_text(encoding='utf-8')
          replacements = {
              'registers 27 logical resources in the version 2 catalogue': 'registers 29 logical resources in the version 2 catalogue',
              'catalogue.resources.length, 27': 'catalogue.resources.length, 29',
              'catalogue.resources.map(resource => resource.id)).size, 27': 'catalogue.resources.map(resource => resource.id)).size, 29',
              'bilingual.length, 16': 'bilingual.length, 17',
              'keeps the master course separate and omits excluded or held repositories': 'keeps the master course separate and includes the repaired approved courses',
              'assert.ok(!repositories.includes("advanced-sustainability-air-power-services"));': 'assert.ok(repositories.includes("advanced-sustainability-air-power-services"));',
              'assert.ok(!repositories.includes("aero-skills-launchpad"));': 'assert.ok(repositories.includes("aero-skills-launchpad"));',
              'kind: "course" }).length, 8': 'kind: "course" }).length, 10',
              'learn: 8,': 'learn: 10,'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected test text not found: {old}')
              text = text.replace(old, new)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched files
        run: |
          node governance/check-content.cjs
          node --test tests/*.test.cjs

      - name: Stage patch artifact
        run: |
          mkdir -p navigator-patch/governance navigator-patch/tests
          cp catalogue-data.js app.js index.html README.md VALIDATION_CHECKLIST.md navigator-patch/
          cp governance/inventory-data.cjs navigator-patch/governance/
          cp tests/catalogue.test.cjs navigator-patch/tests/

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: navigator-catalogue-patch
          path: navigator-patch
          if-no-files-found: error
