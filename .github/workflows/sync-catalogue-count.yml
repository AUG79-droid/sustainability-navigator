name: One-off catalogue count sync

on:
  push:
    paths:
      - '.github/workflows/sync-catalogue-count.yml'

permissions:
  contents: write

jobs:
  sync-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync learner-facing resource count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          text = p.read_text(encoding='utf-8')
          pairs = {
            'explorar los 26 recursos.': 'explorar los 27 recursos.',
            'explore all 26 resources.': 'explore all 27 resources.',
          }
          missing = [old for old in pairs if old not in text]
          if missing:
              raise SystemExit(f'Missing expected strings: {missing}')
          for old, new in pairs.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate catalogue and tests
        run: |
          node governance/check-content.cjs
          node --test tests/*.test.cjs
      - name: Commit count correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Sync Navigator interface to 27 resources"
          git push
