name: Capture real Bio-Inspired previews
on:
  push:
    paths:
      - .github/workflows/capture-bio-previews.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture original application cover in each language
        run: |
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1425,891" --wait-for-timeout 5000 "https://aug79-droid.github.io/bio-airbus-ignite/" assets/previews/bio-inspired-innovation-lab-es.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1425,891" --wait-for-timeout 5000 "https://aug79-droid.github.io/bio-airbus-ignite-en/" assets/previews/bio-inspired-innovation-lab-en.png
      - name: Commit genuine application screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/bio-inspired-innovation-lab-es.png assets/previews/bio-inspired-innovation-lab-en.png
          git commit -m "Use genuine Bio-Inspired Innovation Lab covers (ES and EN)"
          git push
