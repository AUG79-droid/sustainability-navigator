name: Direct Open - GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate content and run tests
        run: |
          node governance/check-content.cjs
          node --test tests/*.test.cjs
      - name: Prepare site
        shell: bash
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            if node -e "const p=require('./package.json'); process.exit(p.scripts&&p.scripts.build?0:1)"; then
              if node -e "const p=require('./package.json'); process.exit((p.dependencies&&p.dependencies.vite)||(p.devDependencies&&p.devDependencies.vite)?0:1)"; then npm run build -- --base=./; else npm run build; fi
            fi
          fi
          site_files=(index.html styles.css app.js data.js search-engine.js catalogue-data.js catalogue.js learning-paths-data.js learning-paths.js progress-model.js progress-store.js progress-service.js progress-selectors.js progress-bridge.js progress-ui.js completion-ui.js)
          for file in "${site_files[@]}"; do test -f "$file"; cp "$file" _site/; done
          site_dirs=(responsible-supply-chain-compliance-foundations ethical-armor phytosanitary-defender reach-compliance-challenge year-15-challenge)
          for dir in "${site_dirs[@]}"; do test -f "$dir/index.html"; cp -a "$dir" _site/; done
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
