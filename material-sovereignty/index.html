<script>
const MISSIONS=[{"id":"titanium-crisis","title":{"es":"Mapa de materiales críticos","en":"Critical materials map"},"subtitle":{"es":"Materias primas, riesgos y dependencia","en":"Resources, risk and dependency"},"theory":{"en":{"intro":"Titanium is valued for strength, corrosion resistance and temperature performance. In aerospace, dependence on a narrow supply base can become a resilience problem when geopolitical or industrial disruptions occur.","concepts":["Why titanium matters in aerospace structures and systems","How supplier concentration increases vulnerability","Why dual sourcing, specification review and demand management matter"],"relevance":"This mission shows that material sovereignty is not about eliminating titanium. It is about understanding where dependence is critical and where resilience can be designed in."},"es":{"intro":"El titanio es valioso por su resistencia, su comportamiento frente a la corrosión y su rendimiento a temperatura. En aeroespacial, depender de una base de suministro estrecha puede convertirse en un problema de resiliencia cuando hay disrupciones geopolíticas o industriales.","concepts":["Por qué el titanio es importante en estructuras y sistemas aeroespaciales","Cómo la concentración de proveedores aumenta la vulnerabilidad","Por qué importan la doble fuente, la revisión de especificaciones y la gestión de la demanda"],"relevance":"Esta misión muestra que la soberanía de materiales no consiste en eliminar el titanio. Consiste en entender dónde la dependencia es crítica y dónde se puede diseñar resiliencia."}},"image":"plate","questions":[{"q":{"es":"Un programa depende de titanio de alta especificación. ¿Qué deberíamos cartografiar antes de afirmar que el material está garantizado?","en":"A programme relies on tightly specified titanium. What should be mapped before declaring supply secure?"},"options":[{"es":"Origen, transformación, capacidad de proveedores cualificados, plazo y alternativas aprobadas.","en":"Origin, processing, qualified supplier capacity, lead time and approved alternatives."},{"es":"Solo el país de domicilio del proveedor directo.","en":"Only the direct supplier’s registered country."},{"es":"Únicamente las existencias del almacén central.","en":"Only stock in the central warehouse."}],"correct":0,"reason":{"es":"La vulnerabilidad puede estar en refinado, forja o cualificación, incluso si el proveedor directo está cerca.","en":"Vulnerability may sit in refining, forging or qualification, even if the direct supplier is nearby."},"weight":[6,5,5,5]},{"q":{"es":"¿Cuál de estas afirmaciones distingue correctamente una materia prima estratégica de un material difícil de adquirir?","en":"Which statement correctly distinguishes an EU strategic raw material from a hard-to-source aerospace material?"},"options":[{"es":"Cualquier material caro es automáticamente estratégico según la UE.","en":"Any expensive material is automatically strategic under EU law."},{"es":"Un material fuera de una lista europea no puede generar riesgos industriales.","en":"An unlisted material cannot create industrial risk."},{"es":"Una lista regulatoria y una criticidad específica de programa responden a criterios diferentes.","en":"A regulatory list and programme-specific criticality use different criteria."}],"correct":2,"reason":{"es":"Las listas europeas describen categorías de materias primas; cada aplicación debe evaluar además calidad, forma, proveedores y dependencia.","en":"EU lists classify raw materials; each application also needs assessment of grade, form, suppliers and dependencies."},"weight":[6,5,5,5]},{"q":{"es":"Una aleación de aluminio y otra de titanio cumplen la función propuesta, con diferencias de coste, fabricación y masa. ¿Cómo comparar?","en":"An aluminium alloy and a titanium alloy both meet the intended function but differ in cost, manufacturing and mass. How should they be compared?"},"options":[{"es":"Elegir aluminio porque siempre tiene menor huella.","en":"Choose aluminium because it always has a lower footprint."},{"es":"Mediante una comparación de prestaciones, ciclo de vida y riesgo de suministro usando criterios y datos equivalentes.","en":"Compare performance, life cycle and supply exposure using equivalent criteria and data."},{"es":"Elegir titanio porque aparece en la lista estratégica.","en":"Choose titanium because it appears on the strategic list."}],"correct":1,"reason":{"es":"No existe un material ganador universal: el contexto funcional y el ciclo de vida determinan la comparación.","en":"There is no universally winning material: function and life cycle determine the trade-off."},"weight":[6,5,5,5]},{"q":{"es":"Se identifica un riesgo asociado a tierras raras en imanes de un equipo. ¿Cuál es la primera pregunta útil?","en":"A rare-earth risk is identified in equipment magnets. What is the first useful question?"},"options":[{"es":"¿Qué función cumplen, qué alternativas y proveedores existen y qué requisitos de rendimiento deben respetarse?","en":"What function do they serve, which alternatives and suppliers exist, and which performance requirements apply?"},{"es":"¿Podemos eliminar todos los imanes sin análisis?","en":"Can all magnets be removed without analysis?"},{"es":"¿Cuántos correos ha enviado Compras este mes?","en":"How many emails has Procurement sent this month?"}],"correct":0,"reason":{"es":"Identificar la función y la dependencia evita soluciones simplistas y permite priorizar desarrollos realistas.","en":"Understanding function and dependency avoids simplistic solutions and supports realistic priorities."},"weight":[6,5,5,5]},{"q":{"es":"El wolframio presenta riesgo de suministro para una aplicación de desgaste. ¿Qué respuesta es más sólida?","en":"Tungsten supply is at risk for a wear-related application. What is the stronger response?"},"options":[{"es":"Cambiar inmediatamente a cualquier metal disponible.","en":"Switch immediately to any available metal."},{"es":"Duplicar compras sin estimar demanda ni plazo.","en":"Double orders without assessing demand or lead times."},{"es":"Estudiar la criticidad del componente, las rutas cualificadas y la viabilidad técnica de sustitución o recuperación.","en":"Assess component criticality, qualified routes, and the technical feasibility of substitution or recovery."}],"correct":2,"reason":{"es":"La sustitución exige validar propiedades; el aprovisionamiento preventivo debe dirigirse a riesgos reales.","en":"Substitution requires validation, and preventive sourcing should target real exposure."},"weight":[6,5,5,5]},{"q":{"es":"Una empresa tiene dos suministradores de un semiproducto, pero ambos compran al mismo productor. ¿Qué indica?","en":"A company has two suppliers for a semi-finished product, but both buy from the same producer. What does this indicate?"},"options":[{"es":"Solo importa el precio del proveedor más barato.","en":"Only the lowest supplier price matters."},{"es":"Existe diversificación comercial, pero persiste un punto común de fallo.","en":"Commercial diversification exists, but a shared failure point remains."},{"es":"La doble fuente elimina todo riesgo de suministro.","en":"Two suppliers eliminate all supply risk."}],"correct":1,"reason":{"es":"La diversificación de contratos no garantiza diversidad de materias primas o procesos.","en":"Multiple contracts do not guarantee diversity of feedstock or processes."},"weight":[6,5,5,5]},{"q":{"es":"¿Qué materiales de los siguientes figuran en la lista estratégica del Reglamento (UE) 2024/1252?","en":"Which of the following appear on the strategic raw materials list under Regulation (EU) 2024/1252?"},"options":[{"es":"Titanio metálico, wolframio y tierras raras para imanes permanentes.","en":"Titanium metal, tungsten and rare earths for permanent magnets."},{"es":"Todos los compuestos aeroespaciales y cualquier tipo de acero inoxidable.","en":"All aerospace composites and every type of stainless steel."},{"es":"Cualquier material que Airbus utilice en un avión.","en":"Any material used in an Airbus aircraft."}],"correct":0,"reason":{"es":"La clasificación legal es específica. Otros materiales pueden ser importantes industrialmente sin formar parte de esa lista.","en":"The legal classification is specific. Other materials may be industrially important without appearing on that list."},"weight":[6,5,5,5]},{"q":{"es":"Una referencia consume poco material pero necesita 18 meses de cualificación de otra fuente. ¿Cómo tratar el riesgo?","en":"A part uses little material but needs 18 months to qualify another source. How should the risk be handled?"},"options":[{"es":"Considerar riesgo bajo porque la masa es pequeña.","en":"Assume low risk because the mass is small."},{"es":"Esperar al fallo del proveedor para comenzar la homologación.","en":"Wait for supplier failure before qualification begins."},{"es":"Incluir tiempo de recuperación y falta de alternativas, no solo toneladas consumidas.","en":"Include recovery time and lack of alternatives, not only tonnage used."}],"correct":2,"reason":{"es":"Los plazos de cualificación pueden dominar el riesgo operativo aunque el volumen material sea bajo.","en":"Qualification lead times may dominate operational exposure despite low material volume."},"weight":[6,5,5,5]},{"q":{"es":"¿Qué indicadores combinados servirían para vigilar la exposición de materiales críticos?","en":"Which combined indicators would best monitor critical-material exposure?"},"options":[{"es":"Toneladas compradas como único dato.","en":"Purchased tonnage as the only figure."},{"es":"Concentración por etapa, fuente única, plazo de suministro y cobertura de componentes críticos.","en":"Concentration by stage, single-source status, lead time and coverage of critical components."},{"es":"Número de reuniones y tamaño de las presentaciones.","en":"Meeting count and presentation size."}],"correct":1,"reason":{"es":"Un cuadro de mando útil conecta vulnerabilidad y capacidad de respuesta, no solo volumen.","en":"An effective iones de ciclo de vida moldean la soberanía a largo plazo"],"relevance":"Esta misión conecta el ecodiseño directamente con la soberanía de materiales futura: las decisiones de hoy determinan la flexibilidad de mañana."}},"image":"modular","questions":[{"q":{"es":"Se mezclan virutas de titanio y aluminio en el mismo contenedor. ¿Qué problema puede aparecer?","en":"Titanium and aluminium turnings are mixed in one container. What problem can result?"},"options":[{"es":"Pérdida de trazabilidad y de rutas de recuperación de calidad, además de requisitos de manipulación.","en":"Loss of traceability and high-quality recovery routes, plus handling requirements."},{"es":"Una mezcla equivalente a una nueva aleación útil sin ensayos.","en":"A useful new alloy without any testing."},{"es":"Un reciclaje automáticamente más eficiente.","en":"Automatically more efficient recycling."}],"correct":0,"reason":{"es":"La segregación adecuada protege la calidad y las opciones de valorización.","en":"Correct segregation protects quality and recovery options."},"weight":[6,5,5,5]},{"q":{"es":"Un lote de recortes limpios de superaleación de níquel tiene composición documentada. ¿Qué sería razonable explorar?","en":"A clean documented batch of nickel-superalloy offcuts is available. What is reasonable to explore?"},"options":[{"es":"Mezclarlo con chatarra general para simplificar gestión.","en":"Mix with general scrap to simplify handling."},{"es":"Declararlo automáticamente apto para cualquier pieza aeronáutica.","en":"Declare it automatically suitable for any aerospace part."},{"es":"Una ruta de recuperación compatible con composición y calidad requeridas.","en":"A recovery pathway compatible with required chemistry and quality."}],"correct":2,"reason":{"es":"La recuperación de alto valor exige identificar aleación, contaminación y destino viable.","en":"High-value recovery requires alloy identification, contamination control and a viable destination."},"weight":[6,5,5,5]},{"q":{"es":"Una mains."},{"es":"Dimensiones, grado, identificación, requisitos técnicos y ruta de aprobación.","en":"Dimensions, grade, identification, technical requirements and approval route."}],"correct":2,"reason":{"es":"Reutilizar material exige conservar evidencias y adecuación a la función.","en":"Reuse requires evidence and fitness for the intended function."},"weight":[6,5,5,5]},{"q":{"es":"En un taller disminuyen los residuos, pero sube la tasa de piezas rechazadas. ¿Qué revela?","en":"Workshop waste decreases but rejected-part rate rises. What does this reveal?"},"options":[{"es":"La calidad no está relacionada con ecodiseño.","en":"Quality is unrelated to eco-design."},{"es":"Hay que analizar eficiencia global de material y calidad, no solo contenedores enviados a gestor.","en":"Analyse overall material efficiency and quality, not only waste sent to processors."},{"es":"La circularidad ha mejorado automáticamente.","en":"Circularity has automatically improved."}],"correct":1,"reason":{"es":"Indicadores aislados pueden ocultar traslado de pérdidas a otras etapas.","en":"Single metrics can hide burden shifting to other stages."},"weight":[6,5,5,5]},{"q":{"es":"El nuevo reciclador propone otra ruta de procesado para titanio. ¿Qué evaluar?","en":"A new recycler proposes a different titanium processing route. What should be evaluated?"},"options":[{"es":"Rendimiento recuperado, contaminación, energía, trazabilidad y usos finales.","en":"Recovered yield, contamination, energy, traceability and final applications."},{"es":"Solo el precio que paga por el residuo.","en":"Only the price paid for scrap."},{"es":"Solo la distancia en kilómetros.","en":"Only distance in kilometres."}],"correct":0,"reason":{"es":"El beneficio ambiental y la soberanía dependen de la ruta real y de lo que sustituya.","en":"Environmental benefit and sovereignty depend on the real route and what it replaces."},"weight":[6,5,5,5]},{"q":{"es":"¿Por qué conservar recortes de grado conocido puede ayudar a la resiliencia?","en":"Why can retaining known-grade offcuts support resilience?"},"options":[{"es":"Porque elimina todos los proveedores externos.","en":"Because it eliminates all external suppliers."},{"es":"Porque evita los controles de material recuperado.","en":"Because it avoids checks on recovered material."},{"es":"Puede crear una fuente secundaria trazable si existe una ruta técnica de recuperación.","en":"They may provide a traceable secondary source where a technical recovery route exists."}],"correct":2,"reason":{"es":"La circularidad puede complementar suministro primario, nunca sustituir toda la gestión de riesgo.","en":"Circularity can complement primary supply but never eliminate all risk management."},"weight":[6,5,5,5]},{"q":{"es":"Un equipo quiere comunicar «circularidad del 100 %» de un material. ¿Qué respuesta es adecuada?","en":"A team wants to claim “100% circularity” for a material. What is appropriate?"},"options":[{"es":"Contar toda recogida de residuos como reciclaje de igual calidad.","en":"Count all collection as equivalent-quality recycling."},{"es":"Solicitar balance de masas, destinos, pérdidas, calidad y límites antes de comunicar.","en":"Request mass balance, destinations, losses, quality and system boundaries before making the claim."},{"es":"Publicar la cifra porque es inspiradora.","en":"Publish the figure because it sounds inspiring."}],"correct":1,"reason":{"es":"La comunicación debe distinguir material recogido, recuperado y realmente reintegrado.","en":"Communication must distinguish collected, recovered and actually reintegrated material."},"weight":[6,5,5,5]},{"q":{"es":"¿Cómo se conecta la circularidad con una estrategia de soberanía?","en":"How does circularity connect with sovereignty strategy?"},"options":[{"es":"Conserva valor y crea opciones de suministro secundario, dentro de límites técnicos y de volumen.","en":"It retains value and provides secondary sourcing options within technical and volume limits."},{"es":"Solo mejora la imagen corporativa.","en":"It only improves corporate image."},{"es":"Garantiza independencia material total.","en":"It guarantees total material independence."}],"correct":0,"reason":{"es":"Una ruta circular bien gestionada puede reducir exposición y consumo de recursos primarios.","en":"Well-managed circular routes may reduce exposure and primary resource demand."},"weight":[6,5,5,5]}]},{"id":"strategy-2040","title":{"es":"Decisiones hacia 2040","en":"Decisions towards 2040"},"subtitle":{"es":"Estrategia, indicadores y autonomía","en":"Strategy, metrics and sovereignty"},"theory":{"en":{"intro":"Long-term resilience needs more than isolated fixes. It needs a roadmap combining data, design, circularity, sourcing and capability development.","concepts":["Why roadmaps matter for critical material strategy","How capability building supports sovereignty","Why resilience needs measurable actions and governance"],"relevance":"This final mission consolidates the previous lessons into a strategic view for 2040."},"es":{"intro":"La resiliencia a largo plazo necesita más que soluciones aisladas. Necesita una hoja de ruta que combine datos, diseño, circularidad, suministro y desarrollo de capacidades.","concepts":["Por qué las hojas de ruta importan para la estrategia de materiales críticos","Cómo el desarrollo de capacidades apoya la soberanía","Por qué la resiliencia necesita acciones medibles y gobernanza"],"relevance":"Esta misión final consolida las lecciones anteriores en una visión estratégica hacia 2040."}},"image":"roadmap","questions":[{"q":{"es":"¿Cuál es el primer entregable útil de una hoja de ruta de materiales 2040?","en":"What is the first useful deliverable of a 2040 materials roadmap?"},"options":[{"es":"Un calendario de campañas de comunicación exclusivamente.","en":"A communications-only campaign schedule."},{"es":"Línea base de dependencias, datos fiables, funciones críticas y brechas de capacidad.","en":"A baseline of dependencies, reliable data, critical functions and capability gaps."},{"es":"Un objetivo de independencia total sin análisis.","en":"A target of total independence without analysis."}],"correct":1,"reason":{"es":"Una estrategia necesita un diagnóstico verificable para asignar recursos con criterio.","en":"Strategy needs a verifiable baseline to allocate resources intelligently."},"weight":[6,5,5,5]},{"q":{"es":"Una medida de doble fuente tarda tres años en homologarse. ¿En qué horizonte debe figurar?","en":"A second-source measure takes three years to qualify. Where should it sit on the roadmap?"},"options":[{"es":"En acciones de capacidad estructural con hitos desde el presente.","en":"Under structural capability actions with milestones starting now."},{"es":"Solo en la lista de acciones urgentes del próximo mes.","en":"Only in next month’s emergency actions."},{"es":"Fuera de la hoja de ruta porque tarda demasiado.","en":"Outside the roadmap because it takes too long."}],"correct":0,"reason":{"es":"La resiliencia futura se construye iniciando hoy acciones de maduración lenta.","en":"Future resilience requires starting long-lead capability actions today."},"weight":[6,5,5,5]},{"q":{"es":"¿Qué indicadores resumen mejor una estrategia de soberanía y ecodiseño?","en":"Which indicators best summarise sovereignty and eco-design strategy?"},"options":[{"es":"Cantidad de carteles publicados sobre sostenibilidad.","en":"Count of sustainability posters published."},{"es":"Número de materiales mencionados en el informe.","en":"Number of materials mentioned in the report."},{"es":"Dependencia de fuente única, plazo de recuperación, flexibilidad de diseño y recuperación material con calidad.","en":"Single-source exposure, recovery lead time, design flexibility and quality-controlled material recovery."}],"correct":2,"reason":{"es":"Los indicadores deben medir exposición, capacidad y resultados, no solo actividades.","en":"Indicators should measure exposure, capability and outcomes, not activities."},"weight":[6,5,5,5]},{"q":{"es":"El equipo propone una sustitución de material con menor huella, pero una sola planta cualificada. ¿Qué propones?","en":"A material substitute lowers footprint but relies on one qualified plant. What do you propose?"},"options":[{"es":"Rechazarlo siempre porque tiene una sola planta.","en":"Always reject because it has one plant."},{"es":"Evaluar el compromiso ambiental-resiliencia y desarrollar mitigaciones antes de decidir.","en":"Evaluate environmental-resilience trade-offs and mitigation before deciding."},{"es":"Aprobar sin revisar suministro porque el ACV mejora.","en":"Approve without sourcing review because LCA improves."}],"correct":1,"reason":{"es":"Una buena elección puede requerir mitigación de suministro aunque mejore el ACV.","en":"A good choice may need sourcing mitigation even if its LCA improves."},"weight":[6,5,5,5]},{"q":{"es":"Una propuesta de 2040 se apoya en una única nueva tecnología de reciclaje todavía inmadura. ¿Qué harías?","en":"A 2040 plan depends on one immature recycling technology. What would you do?"},"options":[{"es":"Mantener esa vía en desarrollo y equilibrarla con otras medidas ya viables.","en":"Develop that pathway while balancing it with already feasible measures."},{"es":"Presentar la tecnología como resultado garantizado.","en":"Present it as a guaranteed outcome."},{"es":"Eliminar todas las vías de suministro actuales.","en":"Discontinue all current supply routes."}],"correct":0,"reason":{"es":"La diversificación de medidas evita que toda la estrategia dependa de una apuesta.","en":"A portfolio of measures avoids making strategy depend on a single bet."},"weight":[6,5,5,5]},{"q":{"es":"¿Qué función tendría un equipo multidisciplinar en esta estrategia?","en":"What is the purpose of a cross-functional team in this strategy?"},"options":[{"es":"Sustituir todos los procesos formales de aprobación.","en":"Replace formal approval processes."},{"es":"Delegar los riesgos de material únicamente a comunicación.","en":"Delegate material risks entirely to communications."},{"es":"Confrontar requisitos, suministro, calidad, ACV y sostenimiento para resolver compromisos.","en":"Reconcile requirements, sourcing, quality, LCA and in-service needs to resolve trade-offs."}],"correct":2,"reason":{"es":"Las decisiones conectan disciplinas; no deben perder su trazabilidad y gobernanza.","en":"Decisions cross disciplines and still require traceability and governance."},"weight":[6,5,5,5]},{"q":{"es":"¿Qué hace que una cifra de «reducción de dependencia» sea creíble?","en":"What makes a “reduced dependency” figure credible?"},"options":[{"es":"Que no se divulgue cómo se ha calculado.","en":"Keeping the calculation confidential to everyone."},{"es":"Alcance, línea base, metodología, datos, plazos y comprobación de alternativas viables.","en":"Scope, baseline, method, data, timing and verified viable alternatives."},{"es":"Que la cifra sea redonda y fácil de recordar.","en":"A round number that is easy to remember."}],"correct":1,"reason":{"es":"La credibilidad exige trazabilidad de indicadores y límites de interpretación.","en":"Credibility requires traceable indicators and clear interpretation limits."},"weight":[6,5,5,5]},{"q":{"es":"¿Por qué debe incluirse el sostenimiento de flota en la estrategia?","en":"Why should fleet support be part of materials strategy?"},"options":[{"es":"Porque los repuestos, reparaciones y obsolescencia generan dependencia durante toda la vida del sistema.","en":"Because spares, repairs and obsolescence create dependencies throughout system life."},{"es":"Porque el suministro acaba cuando se entrega la aeronave.","en":"Because supply requirements end at aircraft delivery."},{"es":"Porque solo importa el peso de fabricación.","en":"Because only manufacturing mass matters."}],"correct":0,"reason":{"es":"Las decisiones de diseño impactan décadas de mantenimiento y disponibilidad.","en":"Design choices affect decades of maintenance and availability."},"weight":[6,5,5,5]},{"q":{"es":"Un indicador mejora en emisiones, pero empeora la disponibilidad de repuestos. ¿Qué debería reflejar el informe?","en":"An initiative improves emissions performance but worsens spare availability. What should a report say?"},"options":[{"es":"Comunicar solo la ventaja ambiental.","en":"Communicate only environmental benefits."},{"es":"Ocultar los inconvenientes para evitar dudas.","en":"Hide drawbacks to avoid questions."},{"es":"Mostrar ambas consecuencias y las medidas de mitigación o condiciones de aceptación.","en":"Show both outcomes and mitigation or acceptance conditions."}],"correct":2,"reason":{"es":"La transparencia del compromiso ambiental-operativo es parte del valor formativo.","en":"Transparency about environmental-operational trade-offs is part of the learning value."},"weight":[6,5,5,5]},{"q":{"es":"¿Qué frase conecta sostenibilidad y soberanía sin exagerar resultados?","en":"Which statement links sustainability and sovereignty without overstating benefits?"},"options":[{"es":"La sostenibilidad y la resiliencia no tienen puntos de encuentro.","en":"Sustainability and resilience have no connection."},{"es":"El ecodiseño y la circularidad pueden ampliar opciones de suministro y apoyar resiliencia, cuando se verifica su viabilidad.","en":"Eco-design and circularity can widen sourcing options and support resilience when feasibility is verified."},{"es":"Cada acción ambiental aumenta siempre la disponibilidad de la flota.","en":"Every environmental action always increases fleet availability."}],"correct":1,"reason":{"es":"La narrativa sólida conecta posibilidades con requisitos, evidencia y límites.","en":"A sound narrative links opportunities to requirements, evidence and limitations."},"weight":[6,5,5,5]}]}];
const THEORY=[[{"heading":{"es":"Qué significa realmente «material crítico»","en":"What “critical material” actually means"},"body":{"es":"Un material puede ser imprescindible para un producto y, sin embargo, no estar oficialmente clasificado como materia prima crítica. En la Unión Europea, la criticidad combina importancia económica y riesgo de suministro; el Reglamento (UE) 2024/1252 también recoge una lista de materias primas estratégicas relevante para defensa, espacio y otras tecnologías. La distinción es útil, pero no sustituye un análisis de riesgos del programa: un grado específico, un proceso de transformación o un proveedor cualificado pueden ser el verdadero cuello de botella.","en":"A material may be essential to a product without being officially classified as a critical raw material. In the EU, criticality combines economic importance and supply risk; Regulation (EU) 2024/1252 also establishes a list of strategic raw materials relevant to defence, space and other technologies. This distinction matters but does not replace programme-level risk analysis: a particular grade, processing route or qualified supplier may be the real bottleneck."},"bullets":{"es":["Criticidad europea ≠ criticidad de una pieza concreta.","La soberanía es capacidad de elección y reacción, no autarquía.","Debemos estudiar materias primas, transformación, cualificación y disponibilidad."],"en":["EU criticality ≠ criticality of an individual part.","Sovereignty means options and response capability, not autarky.","Consider raw materials, processing, qualification and availability."]}},{"heading":{"es":"La familia de materiales que importa","en":"The wider materials picture"},"body":{"es":"El titanio metálico y sus aleaciones ofrecen una relación resistencia-peso elevada y resistencia a corrosión. El aluminio y sus aleaciones siguen siendo esenciales para estructuras ligeras. El wolframio se utiliza donde importan dureza y resistencia al desgaste; el cobalto interviene en determinadas aleaciones y tecnologías; las tierras raras, como neodimio y disprosio, son importantes para ciertos imanes. El níquel es fundamental en superaleaciones de alta temperatura, aunque el alcance de la lista estratégica europea se refiere específicamente al níquel de calidad para baterías. Los compuestos de fibra de carbono son muy relevantes en aeroespacial, pero no debemos confundir un material compuesto con una materia prima incluida automáticamente en la lista europea.","en":"Titanium metal and its alloys offer a high strength-to-weight ratio and corrosion resistance. Aluminium alloys remain essential for lightweight structures. Tungsten matters where hardness and wear resistance are needed; cobalt is used in certain alloys and technologies; rare earths such as neodymium and dysprosium support some permanent magnets. Nickel is essential in high-temperature superalloys, although the EU strategic list specifically refers to battery-grade nickel. Carbon-fibre composites are highly relevant to aerospace, but a composite material should not automatically be confused with an EU-listed critical raw material."},"bullets":{"es":["Titanio, aluminio y wolframio: estructuras, componentes y procesos.","Cobalto, tierras raras, galio o germanio: aplicaciones tecnológicas específicas.","Níquel y compuestos: riesgos industriales que requieren análisis por uso y grado."],"en":["Titanium, aluminium and tungsten: structures, components and processes.","Cobalt, rare earths, gallium or germanium: specialised technological uses.","Nickel and composites: industrial risks to assess by application and grade."]}},{"heading":{"es":"Dónde nace la vulnerabilidad","en":"Where vulnerability begins"},"body":{"es":"La disponibilidad final no depende únicamente de que exista mineral suficiente. Una cadena típica pasa por extracción, concentración, refinado, fabricación de aleación, forja o laminación, tratamientos, ensayos, transformación y entrega. Es posible disponer de mineral, pero carecer de una instalación capaz de producir la forma, pureza y certificaciones exigidas. La concentración geográfica, la capacidad de procesado, los tiempos de recalificación y la trazabilidad del lote pueden pesar tanto como la propia extracción.","en":"Final availability is not only about whether enough ore exists. A typical chain may involve mining, concentration, refining, alloy production, forging or rolling, treatments, testing, manufacturing and delivery. Ore can be available while the capacity to produce the required shape, purity and certified quality is missing. Geographic concentration, processing capability, requalification time and batch traceability can matter as much as mining itself."},"bullets":{"es":["Mapear países y etapas, no solo proveedores directos.","Medir piezas con una única fuente y plazos de reposición largos.","Identificar alternativas técnicamente admisibles antes de una crisis."],"en":["Map countries and stages, not only direct suppliers.","Track single-source items and long replenishment lead times.","Identify technically acceptable alternatives before a disruption."]}},{"heading":{"es":"Seguridad del suministro y valor ambiental","en":"Supply security and environmental value"},"body":{"es":"Reducir material innecesario, prolongar vida útil, recuperar recortes y diseñar para la reparabilidad puede disminuir la presión sobre la demanda primaria. También puede aportar flexibilidad ante interrupciones de suministro. Sin embargo, la estrategia no es “reciclar siempre”: hay que analizar calidad, transporte, energía de procesado, pérdidas y el ciclo de vida completo. No se debe prometer automáticamente una reducción de emisiones o costes sin comparar escenarios y disponer de datos.","en":"Removing unnecessary material, extending useful life, recovering offcuts and designing for repairability can reduce pressure on primary demand. They may also provide flexibility when supply is interrupted. But the strategy is not simply “always recycle”: quality, transport, processing energy, losses and the full life cycle must be assessed. Never promise lower emissions or cost automatically without comparing scenarios and evidence."},"bullets":{"es":["Resiliencia: menos dependencia y más alternativas viables.","Ecodiseño: menor impacto a lo largo del ciclo de vida.","Seguridad y conformidad: condiciones que nunca se negocian."],"en":["Resilience: fewer dependencies and more viable options.","Eco-design: lower life-cycle impact.","Safety and compliance: non-negotiable constraints."]}},{"heading":{"es":"Cómo convertirlo en una decisión real","en":"Turning this into a decision"},"body":{"es":"Una revisión útil cruza cuatro preguntas: ¿qué material o tecnología sostiene una función crítica? ¿En qué etapa de la cadena existe dependencia? ¿Cuál es el tiempo hasta que esa dependencia afecta a producción o mantenimiento? ¿Qué alternativas ya están cualificadas y cuáles requieren desarrollo? El resultado debería ser un mapa priorizado y un plan con responsables, plazos y evidencias. El objetivo es anticiparse, no reaccionar cuando el suministro ya falla.","en":"A useful review asks four questions: which material or technology supports a critical function? Where does dependency sit in the chain? How long before that dependency affects production or maintenance? Which alternatives are already qualified and which need development? The output should be a prioritised map and an action plan with owners, timelines and evidence. The aim is anticipation, not waiting for supply to fail."},"bullets":{"es":["Ejemplo de indicador: porcentaje de demanda en referencias de fuente única.","Otro indicador: semanas de cobertura de componentes críticos.","Decisión óptima: priorizar por criticidad y exposición, no solo por precio."],"en":["Metric example: share of demand tied to single-source references.","Another metric: weeks of coverage for critical components.","Best practice: prioritise by criticality and exposure, not price alone."]}}],[{"heading":{"es":"La función manda: no existe un material “mejor” para todo","en":"Function first: no universal “best material”"},"body":{"es":"En ingeniería aeroespacial, un material se selecciona para una función concreta. Resistencia específica, rigidez, comportamiento frente a fatiga, temperatura, corrosión, estabilidad dimensional, peso y conductividad pueden tener prioridades distintas. El titanio puede justificarse por prestaciones y compatibilidad; el aluminio puede ser adecuado donde prima una estructura ligera y una fabricación accesible; las superaleaciones de níquel pueden ser necesarias ante temperaturas elevadas; determinados compuestos pueden ofrecer rigidez con baja masa, pero plantear desafíos de reparación o fin de vida.","en":"In aerospace engineering, material choice must serve a defined function. Specific strength, stiffness, fatigue, temperature, corrosion, dimensional stability, mass and conductivity may have very different priorities. Titanium may be justified by performance and compatibility; aluminium can suit accessible lightweight structures; nickel superalloys may be required at high temperatures; some composites provide stiffness at low mass but create challenges for repair or end of life."},"bullets":{"es":["Comparar propiedades en el entorno real de uso.","Evitar sustituir materiales solo por precio o marketing.","Verificar requisitos técnicos, pruebas y certificación aplicable."],"en":["Compare properties under real service conditions.","Never substitute for cost or marketing reasons alone.","Verify technical requirements, testing and applicable certification."]}},{"heading":{"es":"Ecodiseño: mirar el sistema y su ciclo de vida","en":"Eco-design: assess the system and its life cycle"},"body":{"es":"El análisis de ciclo de vida (ACV) contempla las etapas relevantes desde la obtención de materias primas y fabricación hasta uso, mantenimiento y fin de vida, conforme al objetivo y alcance del estudio. En aeronáutica, una alternativa más ligera puede compensar determinados impactos de fabricación durante la operación, pero ese resultado depende de la aplicación y de las hipótesis. También importan la durabilidad, las reparaciones, el consumo de recambios y la gestión del fin de vida. No basta con comparar kilogramos de material.","en":"Life-cycle assessment (LCA) considers relevant stages from raw material extraction and manufacture through use, maintenance and end of life, according to the study goal and scope. In aviation, a lighter alternative may offset some manufacturing impacts during operation, but that depends on the application and assumptions. Durability, repair events, spare-part demand and end-of-life pathways matter as well. Comparing kilograms of material is not enough."},"bullets":{"es":["Unidad funcional y límites del sistema definidos.","Mismos requisitos y prestaciones para comparar alternativas.","Datos y supuestos documentados: evitar conclusiones categóricas."],"en":["Define the functional unit and system boundary.","Compare alternatives delivering equivalent functions.","Document data and assumptions; avoid categorical claims."]}},{"heading":{"es":"La sobreespecificación también crea dependencia","en":"Over-specification can create dependence"},"body":{"es":"Pedir una tolerancia, pureza o acabado más restrictivos de lo necesario puede reducir el número de proveedores viables, elevar desperdicios y aumentar tiempos de fabricación. Eso no significa relajar requisitos de seguridad: significa comprobar si cada requisito responde a una necesidad técnica demostrada. Una revisión interfuncional entre diseño, materiales, calidad, producción y compras puede ampliar opciones sin comprometer la conformidad. Los cambios deben seguir el proceso de configuración, ensayos y aprobación aplicable.","en":"Demanding tighter tolerances, purity or finishes than required can reduce the viable supplier base, increase waste and lengthen manufacturing lead times. This does not mean relaxing safety requirements: it means checking whether every requirement is linked to a demonstrated technical need. Cross-functional review between design, materials, quality, production and procurement may widen the options while preserving compliance. Changes still follow configuration, testing and approval processes."},"bullets":{"es":["Diferenciar requisitos esenciales de preferencias heredadas.","Medir capacidad real del proveedor antes de cambiar planos.","No confundir “alternativa prometedora” con “alternativa aprobada”."],"en":["Distinguish essential requirements from inherited preferences.","Assess actual supplier capability before changing drawings.","A promising alternative is not the same as an approved one."]}},{"heading":{"es":"Diseñar para reparar, separar y actualizar","en":"Design for repair, disassembly and upgrade"},"body":{"es":"La accesibilidad, la modularidad y las uniones desmontables pueden facilitar inspecciones, reparaciones y sustituciones. Sin embargo, las uniones separables añaden piezas, peso o puntos de fallo; por eso no son siempre preferibles. Un buen ecodiseño analiza el compromiso completo: prestaciones iniciales, tiempo de mantenimiento, disponibilidad de recambios, vida útil y potencial de recuperación. El valor para la resiliencia aparece cuando el diseño ofrece más opciones ante incertidumbre futura.","en":"Accessibility, modularity and removable joints can make inspection, repair and replacement easier. But removable joints may add parts, mass or failure points, so they are not always better. Sound eco-design examines the full trade-off: initial performance, maintenance time, spare-part availability, useful life and recovery potential. The resilience benefit arises when design creates more options under future uncertainty."},"bullets":{"es":["Reparabilidad y modularidad son decisiones de diseño, no eslóganes.","La seguridad y las prestaciones siguen siendo límites.","Evaluar consecuencias a 15–30 años, no solo en fabricación."],"en":["Repairability and modularity are design decisions, not slogans.","Safety and performance remain constraints.","Evaluate outcomes over 15–30 years, not manufacture alone."]}},{"heading":{"es":"Una matriz de decisión que sí ayuda","en":"A decision matrix that works"},"body":{"es":"Elige alternativas técnicamente viables y valóralas frente a indicadores transparentes: desempeño en servicio, madurez y esfuerzo de cualificación, plazos de suministro, concentración de proveedores, coste de ciclo de vida, energía y emisiones del ciclo de vida, y fin de vida. El resultado no es un promedio mágico; requiere criterios de exclusión, ponderaciones y análisis de sensibilidad. Si cambia la prioridad de disponibilidad o aparecen nuevos datos ambientales, la recomendación puede cambiar.","en":"Start with technically feasible alternatives and compare transparent criteria: in-service performance, maturity and qualification effort, supply lead time, supplier concentration, life-cycle cost, life-cycle energy and emissions, and end of life. The result is not a magic average; it requires exclusion criteria, weighting and sensitivity analysis. If availability priorities change or better environmental data emerge, the recommendation can change."},"bullets":{"es":["Filtro 1: seguridad y certificación.","Filtro 2: viabilidad técnica y disponibilidad industrial.","Comparación 3: impacto, coste y resiliencia con datos trazables."],"en":["Gate 1: safety and certification.","Gate 2: technical and industrial feasibility.","Step 3: compare impact, cost and resilience using traceable evidence."]}}],[{"heading":{"es":"La cadena es más larga que el proveedor visible","en":"The chain extends beyond your direct supplier"},"body":{"es":"Un contrato puede estar firmado con una empresa europea y, aun así, depender de refino, aleado, polvo, forja o precursor fabricados en un único país. Para evaluar resiliencia hay que representar la cadena multinivel: origen, procesado, componentes intermedios, fabricantes, proveedores de primer nivel y capacidades de reparación. No toda esa información estará disponible al principio; precisamente por eso importa distinguir hechos confirmados, estimaciones y lagunas de datos.","en":"A contract may be with a European supplier but still depend on refining, alloying, powder, forging or precursor production concentrated in one country. Resilience analysis requires a multi-tier map: origin, processing, intermediate components, manufacturers, tier-one suppliers and repair capabilities. Not all that information will be available immediately, so confirmed facts, estimates and knowledge gaps must be clearly distinguished."},"bullets":{"es":["Pedir trazabilidad proporcionada al riesgo.","Localizar la etapa que no tiene capacidad alternativa.","Crear un registro de incertidumbre sobre datos de suministro."],"en":["Request traceability proportionate to risk.","Find the stage with no alternative capacity.","Maintain a record of supply-data uncertainty."]}},{"heading":{"es":"Dependencia y concentración: dos problemas distintos","en":"Dependency and concentration are different problems"},"body":{"es":"La concentración mide cuánto suministro se acumula en un proveedor, un país o una ruta de proceso. La dependencia aparece cuando esa concentración no tiene alternativas viables en el tiempo necesario. Un componente con dos proveedores comerciales puede seguir siendo de fuente única si ambos dependen de la misma forja o del mismo productor de materia prima. El riesgo también puede venir de una máquina singular, un laboratorio de ensayos o una habilidad industrial escasa.","en":"Concentration measures how much supply is held by one provider, country or processing route. Dependency arises when that concentration has no viable alternative in the required time. A component with two commercial suppliers can still be effectively single-source if both depend on the same forge or feedstock producer. Risk may also arise from a unique machine, testing laboratory or scarce industrial skill."},"bullets":{"es":["No confundir número de contratos con diversidad real de origen.","Revisar puntos de fallo compartidos y capacidad de respuesta.","Evaluar tiempo hasta impacto y tiempo de recuperación."],"en":["Do not confuse contract count with genuine origin diversity.","Check shared failure points and response capacity.","Assess time to impact and time to recovery."]}},{"heading":{"es":"Cualificación: la alternativa debe ser utilizable","en":"Qualification: alternatives must be usable"},"body":{"es":"En un programa aeroespacial no basta con encontrar una aleación “parecida”. Importan forma metalúrgica, estado térmico, propiedades, ensayos, documentación, procesos especiales, configuración y aprobaciones. Una segunda fuente requiere a veces desarrollo de proceso, inspecciones, pruebas y una revisión formal. La estrategia de resiliencia consiste en iniciar ese trabajo antes de la disrupción y mantener la evidencia de equivalencia y conformidad. Comprar un material no cualificado para usarlo inmediatamente puede crear un problema mucho mayor.","en":"For an aerospace programme, finding a “similar” alloy is not enough. Metallurgical form, heat treatment, properties, testing, records, special processes, configuration and approvals matter. A second source may require process development, inspections, tests and formal review. Resilience means starting that work before disruption and retaining evidence of equivalence and compliance. Purchasing unqualified material for immediate use may create a much larger problem."},"bullets":{"es":["Proveedor alternativo ≠ proveedor ya cualificado.","Documentar el plan de homologación y sus hitos.","Proteger seguridad, conformidad y trazabilidad."],"en":["Alternative supplier ≠ already qualified supplier.","Document the qualification plan and its milestones.","Protect safety, compliance and traceability."]}},{"heading":{"es":"Las cuatro palancas de mitigación","en":"Four complementary mitigation levers"},"body":{"es":"No existe una respuesta única. Las palancas habituales incluyen diversidad de origen y proveedor, rediseño o revisión de especificaciones, circularidad y recuperación de material, y gestión selectiva de inventario o capacidad. Conviene combinar acciones rápidas y estructurales: por ejemplo, cobertura temporal de stock para una referencia crítica mientras se desarrolla una segunda fuente. Un aumento indiscriminado del inventario inmoviliza recursos y no corrige un cuello de botella técnico.","en":"There is no single response. Typical levers include sourcing diversity, redesign or specification review, circularity and material recovery, and selective inventory or capacity management. Combine short-term and structural actions: for example, temporary stock coverage for a critical item while a second source is qualified. Indiscriminate inventory growth ties up resources and does not solve a technical bottleneck."},"bullets":{"es":["Mitigación inmediata: visibilidad, priorización y cobertura selectiva.","Mitigación estructural: cualificación, diseño y capacidades industriales.","Todas las medidas deben tener propietario y fecha de revisión."],"en":["Immediate mitigation: visibility, prioritisation and selective coverage.","Structural mitigation: qualification, design and industrial capability.","Every measure needs an owner and review date."]}},{"heading":{"es":"Indicadores que anticipan problemas","en":"Leading indicators that provide warning"},"body":{"es":"Un buen cuadro de mando combina señales adelantadas y resultados: porcentaje de piezas de fuente única, plazos de reposición, concentración por país y etapa, cobertura de inventario, estado de fuentes alternativas, riesgo de obsolescencia y tiempo estimado de recuperación. También debe registrar el impacto ambiental de las medidas: más stock o transportes urgentes pueden aumentar el impacto. No se trata de maximizar una puntuación arbitraria, sino de tomar decisiones justificadas bajo escenarios de incertidumbre.","en":"A good dashboard mixes leading signals and outcomes: share of single-source parts, replenishment lead times, concentration by country and processing stage, inventory coverage, status of alternative sources, obsolescence risk and estimated recovery time. It should also track environmental consequences: extra inventory or urgent transport may increase impacts. The objective is not to maximise an arbitrary score but to justify choices under uncertainty."},"bullets":{"es":["Indicadores verificables y actualizados, no solo una cifra de riesgo.","Escenarios para comprobar robustez de las alternativas.","Escalado temprano cuando se cruza un umbral de exposición."],"en":["Use verifiable, current indicators rather than a single risk score.","Stress-test alternatives with scenarios.","Escalate early when an exposure threshold is crossed."]}}],[{"heading":{"es":"Circularidad industrial: conservar valor técnico","en":"Industrial circularity: preserve technical value"},"body":{"es":"En la industria aeroespacial, reducir residuos es solo una parte del objetivo. La prioridad es conservar el valor de materiales y componentes durante el mayor tiempo compatible con seguridad y prestaciones. En mecanizado, por ejemplo, los recortes de titanio, aluminio y superaleaciones pueden tener valor elevado; si se mezclan grados y contaminantes, puede perderse la posibilidad de recuperación de calidad. También hay oportunidades en remanufactura, reutilización controlada de excedentes y diseño para reparación, siempre dentro de los requisitos aplicables.","en":"In aerospace manufacturing, reducing waste is only part of the goal. The priority is to retain the value of materials and components for as long as safety and performance allow. In machining, titanium, aluminium and superalloy offcuts can have substantial value; mixing grades or contaminants may remove high-quality recovery options. There may also be opportunities in remanufacture, controlled reuse of excess stock and repair-oriented design, always within applicable requirements."},"bullets":{"es":["Prevención y uso eficiente antes que reciclaje.","Separación por aleación, proceso, contaminación y trazabilidad.","Calidad técnica: condición previa para uso de alto valor."],"en":["Prevention and efficiency before recycling.","Segregate by alloy, process, contamination and traceability.","Technical quality comes first for high-value reuse."]}},{"heading":{"es":"Titanio, aluminio y níquel: rutas distintas","en":"Titanium, aluminium and nickel: different pathways"},"body":{"es":"El titanio requiere controlar aleación, grado y contaminantes; sus virutas pueden presentar desafíos de manejo y reprocesado. Las aleaciones de aluminio cuentan con rutas de reciclaje maduras, pero mezclar familias de aleaciones puede limitar el uso del material secundario. En superaleaciones con níquel y otros elementos valiosos, recuperar química y calidad puede ser relevante tanto para costes como para seguridad de suministro. El resultado ambiental depende de la ruta específica, la calidad alcanzada, el consumo energético y la sustitución real de material primario.","en":"Titanium recovery requires alloy, grade and contamination control; turnings may need special handling and processing. Aluminium alloys have established recycling routes, but mixing alloy families can restrict where secondary material can be used. For nickel-based superalloys and other valuable constituents, chemistry and quality recovery can matter for both cost and security of supply. Environmental outcomes depend on the route, attained quality, processing energy and genuine substitution of primary material."},"bullets":{"es":["Clasificar recortes limpios y virutas contaminadas de forma separada.","Trazar procedencia y composición cuando sea necesario.","Verificar la calidad y la viabilidad de retorno a usos exigentes."],"en":["Separate clean offcuts from contaminated turnings.","Track origin and composition as required.","Verify quality and feasibility for demanding end uses."]}},{"heading":{"es":"Compuestos y tierras raras: oportunidades con límites","en":"Composites and rare earths: opportunities and limits"},"body":{"es":"Los compuestos termoestables de fibra de carbono pueden ofrecer prestaciones excelentes, pero recuperar fibras con las propiedades requeridas y gestionar resinas constituye un reto. Los métodos de recuperación no equivalen automáticamente a un circuito cerrado para piezas estructurales. En equipos eléctricos y electrónicos, determinados imanes con tierras raras también plantean desafíos de desmontaje, separación y recuperación; la viabilidad depende de pureza, escala y tecnologías. Por eso los mensajes de “100 % circular” sin evidencia son inadecuados.","en":"Thermoset carbon-fibre composites can deliver excellent performance, but recovering fibres with required properties and dealing with resins remain challenges. Recovery does not automatically equal a closed loop into structural aircraft parts. In electrical or electronic equipment, some rare-earth magnets also pose disassembly, separation and recovery challenges; feasibility depends on purity, scale and technology. Claims of “100% circular” without evidence are therefore inappropriate."},"bullets":{"es":["Distinguir reciclaje, valorización y uso equivalente.","No prometer retención íntegra de propiedades sin ensayos.","Diseñar pensando en desmontaje, separación y fin de vida."],"en":["Distinguish recycling, recovery and equivalent-use recycling.","Do not claim full property retention without testing.","Consider disassembly, separation and end of life at design stage."]}},{"heading":{"es":"Del residuo al recurso: gestión y colaboración","en":"From waste to resource: governance and collaboration"},"body":{"es":"Una iniciativa de circularidad necesita acuerdos entre diseño, fabricación, medio ambiente, compras, calidad y gestores externos. Hay que establecer puntos de generación, segregación, identificación de lotes, condiciones de almacenamiento, controles de contaminación, salidas autorizadas y seguimiento de destinos. El cumplimiento de la normativa de residuos y sustancias debe revisarse caso a caso. La circularidad no puede basarse solo en una campaña; requiere procedimientos, datos y trazabilidad. También importa la demanda efectiva del material recuperado.","en":"A circularity initiative needs coordination among design, manufacturing, environment, procurement, quality and external processors. Define generation points, segregation rules, batch IDs, storage conditions, contamination controls, authorised routes and destination tracking. Waste and substance compliance must be assessed case by case. Circularity cannot rely on a campaign alone; it requires procedures, data and traceability. Actual demand for the recovered material also matters."},"bullets":{"es":["Responsabilidades compartidas y rutas aprobadas.","Indicadores de rendimiento y calidad del material recuperado.","Verificación de impactos para evitar trasladarlos a otra fase."],"en":["Shared ownership and approved routes.","Yield and quality KPIs for recovered material.","Verify impacts to avoid shifting burdens elsewhere."]}},{"heading":{"es":"Qué valor aporta a la resiliencia","en":"How circularity strengthens resilience"},"body":{"es":"Los circuitos de recuperación bien diseñados pueden convertirse en una fuente complementaria de material, reducir exposición a rutas primarias y conservar conocimiento industrial. Pero no eliminan todas las dependencias: la tasa de retorno, la calidad, los plazos y la capacidad de transformación limitan su contribución. El mensaje estratégico correcto es: circularidad y ecodiseño pueden reforzar soberanía y continuidad operativa, siempre que demostremos el rendimiento técnico, la viabilidad económica y el balance ambiental.","en":"Well-designed recovery loops can become a complementary material source, reduce exposure to primary routes and preserve industrial know-how. They do not eliminate every dependency: return rates, quality, lead time and processing capacity limit their contribution. The appropriate strategic message is that circularity and eco-design can reinforce sovereignty and operational continuity when technical performance, economic feasibility and environmental balance are demonstrated."},"bullets":{"es":["Medir sustitución real de material primario.","Relacionar circularidad con suministro y disponibilidad.","Evitar frases absolutas: «sin impacto», «independencia total»."],"en":["Measure real replacement of primary feedstock.","Link circularity KPIs to supply and availability.","Avoid absolute claims: “zero impact”, “total independence”."]}}],[{"heading":{"es":"Soberanía a largo plazo: un programa, no una campaña","en":"Long-term sovereignty: a programme, not a campaign"},"body":{"es":"La capacidad de responder a interrupciones futuras depende de decisiones que se toman hoy en ingeniería, compras, fabricación y sostenimiento. La estrategia 2040 debe combinar conocimiento de dependencias, diversidad de capacidades, diseño flexible, circularidad, talento e inversión. No existe un horizonte único que sirva para todos los componentes: una pieza con vida de décadas, un sistema electrónico sometido a obsolescencia rápida y un consumible de mantenimiento tienen riesgos distintos. Conviene adaptar el plan a cada familia tecnológica.","en":"Responding to future disruptions depends on decisions made today in engineering, procurement, manufacturing and support. A 2040 strategy combines dependency intelligence, capability diversity, flexible design, circularity, skills and investment. There is no single planning horizon for every component: a decades-long structural part, fast-obsolescing electronics and a maintenance consumable face different risks. Plans should reflect the technology family."},"bullets":{"es":["Pensar en la vida útil total, incluida la flota en servicio.","Separar acciones inmediatas de capacidades a desarrollar.","Alinear los horizontes con los ciclos industriales reales."],"en":["Consider the full useful life, including the in-service fleet.","Separate near-term actions from capabilities to develop.","Match horizons to actual industrial cycles."]}},{"heading":{"es":"Una cartera de iniciativas coherente","en":"A coherent portfolio of initiatives"},"body":{"es":"Una hoja de ruta equilibrada combina, por ejemplo, análisis de concentración de titanio, opciones de suministro de aleaciones y piezas, mejora de la recuperación de recortes, revisión de especificaciones, rediseño reparable, cualificación anticipada de variantes y seguimiento de imanes o electrónica con tierras raras. Cada proyecto debe especificar el problema, quién decide, qué evidencia falta, qué requisito no puede comprometerse y qué beneficio se espera. Esto permite distinguir acciones prometedoras de resultados ya demostrados.","en":"A balanced roadmap can combine titanium exposure mapping, alloy and part sourcing options, improved offcut recovery, specification reviews, repairable redesign, advance qualification of variants and monitoring of rare-earth magnets or electronics. Each project should state the problem, decision owner, missing evidence, requirements that cannot be compromised and expected benefit. This distinguishes promising actions from demonstrated results."},"bullets":{"es":["Evitar depender de una única solución tecnológica.","Priorizar acciones según exposición y madurez.","Revisar beneficios cuando cambien mercados o requisitos."],"en":["Avoid relying on one technology.","Prioritise by exposure and maturity.","Revisit benefits when markets or requirements change."]}},{"heading":{"es":"Indicadores para dirección y equipos técnicos","en":"Indicators for management and engineering teams"},"body":{"es":"No conviene reducir la resiliencia a un número. Un cuadro de mando sólido combina exposición y respuesta: porcentaje de referencias con fuente única, cobertura de stock de materiales de alta criticidad, plazo de cualificación de una segunda fuente, contenido recuperado de calidad verificable, reducción de material por función y flexibilidad de mantenimiento. También se pueden seguir parámetros ambientales mediante ACV. Para que el dato tenga sentido hay que definir alcance, unidad, línea base, frecuencia y responsables.","en":"Resilience should not be reduced to one number. A sound dashboard combines exposure and response: share of single-source references, coverage for high-criticality material, lead time to qualify a second source, traceable high-quality recovery, material intensity per function and maintenance flexibility. Environmental measures can be tracked through LCA as well. Each metric needs a scope, unit, baseline, frequency and owner."},"bullets":{"es":["Indicadores de riesgo y capacidad, no solo actividad.","Metas realistas y trazables con datos verificables.","Análisis de escenarios para no confundir correlación con beneficio."],"en":["Track risk and capability, not merely activity.","Set realistic, traceable goals with verifiable data.","Use scenarios rather than assuming correlation proves benefit."]}},{"heading":{"es":"Gobernanza y decisiones transversales","en":"Governance and cross-functional decisions"},"body":{"es":"La soberanía de materiales no puede delegarse en un único departamento. Compras conoce contratos y proveedores; diseño determina especificaciones; materiales e ingeniería validan propiedades; producción conoce pérdidas y procesos; calidad gestiona evidencias; medio ambiente aporta ciclo de vida y cumplimiento; servicios en operación conocen necesidades de soporte. Un foro de revisión puede detectar contradicciones: una alternativa puede reducir huella pero empeorar disponibilidad o una nueva fuente puede mejorar continuidad y aumentar transporte. La decisión debe documentar esos compromisos.","en":"Material sovereignty cannot be delegated to one department. Procurement sees contracts and suppliers; design sets specifications; materials engineering validates properties; manufacturing sees losses and processes; quality maintains evidence; environment supports life-cycle assessment and compliance; in-service teams know support needs. Cross-functional reviews reveal conflicts: an option may lower footprint while worsening availability, or a new source may improve continuity but increase transport. These trade-offs must be documented."},"bullets":{"es":["Revisión interfuncional de riesgos y oportunidades.","Procesos claros para seleccionar y aprobar alternativas.","Conexión entre programas, sostenibilidad y resiliencia operativa."],"en":["Cross-functional risk and opportunity review.","Clear selection and approval processes for alternatives.","Connect programmes, sustainability and operational resilience."]}},{"heading":{"es":"Narrativa estratégica: explicar el valor sin exagerar","en":"Strategic narrative: show value without overstating"},"body":{"es":"Una propuesta convincente explica una cadena de valor verificable: «la revisión de diseño reduce la dependencia de una aleación»; «la segunda fuente cualificada mejora la capacidad de respuesta»; «la recuperación de material trazable reduce la necesidad de materia prima en determinados usos». Después se indican límites e incertidumbres. No se debe atribuir a la compañía una política o beneficio no aprobado. Se trata de formar a los equipos para reconocer cómo decisiones de sostenibilidad también pueden apoyar la efectividad operativa.","en":"A credible proposition explains a verifiable value chain: “a design review reduces dependence on an alloy”; “a qualified second source improves response capability”; “traceable material recovery reduces primary feedstock needs in selected uses”. Then it makes limitations and uncertainty clear. Do not attribute an unapproved policy or benefit to the company. The training goal is to help teams recognise how sustainability choices can also support operational effectiveness."},"bullets":{"es":["Sostenibilidad: evidencia de impacto ambiental.","Soberanía: menor exposición a dependencias críticas.","Efectividad operativa: capacidad de responder y mantener funciones."],"en":["Sustainability: evidence of environmental impact.","Sovereignty: reduced exposure to critical dependencies.","Operational effectiveness: ability to respond and sustain functions."]}}]];

function metrics(){

 ];

function brief(){let m=mission();const briefTexts=[
 {es:'Tienes que priorizar materiales y dependencias de una cadena de suministro aeroespacial. El reto no consiste en comprar más, sino en saber qué es realmente crítico, dónde está el riesgo y cómo ganar capacidad de respuesta.',en:'Prioritise materials and dependencies in an aerospace supply chain. The challenge is not simply to buy more, but to understand what is truly critical, where risk sits and how to improve response capacity.'},

 return `${metrics()}<div class="overline">${tr('completedMission')} · ${s.mission+1}/5</div><h2 class="mainTitle">${esc(loc(m.title))}</h2><p class="lede">${tr('missionSummaryBody')}</p><div class="reportSummary"><div class="reportTile"><b>${tr('correctAnswers')}</b><strong>${correct}/10</strong><p>${tr('resultNote')}</p></div><div class="reportTile"><b>${tr('nextLearning')}</b><strong>${s.mission<4?String(s.mission+2).padStart(2,'0'):'/ 5'}</strong><p>${s.mission<4?esc(loc(MISSIONS[s.mission+1].title)):tr('finalReportHint')}</p></div></div><div class="theorySection wide"><div class="overline">${tr('remember')}</div><ul>${summaryBullets}</ul><p>${tr('lessonsReinforce')}</p></div><div class="btnbar"><button class="btn" data-action="review-current">${tr('reviewTheory')}</button><button class="btn primary" data-action="next-mission">${s.mission===4?tr('report'):tr('openNextTheory')} →</button></div>`;
}
function report(){const correct=s.answers.filter(a=>MISSIONS[a.m].questions[a.q].correct===a.option).length;const pct=Math.round(correct/50*100);const band=pct>=78?tr('reportHigh'):pct>=58?tr('reportMid'):tr('reportLow');return `${metrics()}<div class="overline">${tr('report')}</div><h2 class="mainTitle">${tr('report')}</h2><p class="lede">${tr('reportText')}</p><div class="reportSummary"><div class="reportTile"><b>${tr('score')}</b><strong>${pct}%</strong><p>${correct} / 50 · ${band}</p></div><div class="reportTile"><b>${tr('progress')}</b><strong>${total()} / 50</strong><p>${tr('scoreNote')}</p></div></div><div class="info"><strong>${tr('reportKey')}</strong><ol class="takeaways">${T[s.lang].finalPoints.map(p=>`<li>${esc(p)}</li>`).join('')}</ol></div><h3>${tr('missions')}</h3><div class="theoryGrid">${MISSIONS.map((m,i)=>{let answers=s.answers.filter(a=>a.m===i),hits=answers.filter(a=>m.questions[a.q].correct===a.option).length;return `<div class="theorySection"><div class="number">0${i+1}</div><h3>${esc(loc(m.title))}</h3><p>${hits} / 10</p><button class="btn" data-action="review" data-i="${i}">${tr('review')}</button></div>`}).join('')}</div><div class="btnbar"><button class="btn" data-action="print">${tr('download')}</button><button class="btn primary" data-action="reset">${tr('newGame')}</button></div>`}
function render(move=false){staticTexts();nav();get('main').innerHTML=s.screen==='home'?home():s.screen==='brief'?brief():s.screen==='question'?question():s.screen==='theory'?fullTheory():s.screen==='summary'?summary():report();save();if(move){get('main').scrollIntoView({block:'start',behavior:'instant'});}}
function reset(){if(!confirm(s.lang==='es'?'¿Quieres reiniciar todas las respuestas y el progreso?':'Restart all answers and progress?'))return;const lang=s.lang;s=initial();s.lang=lang;render(true);}
function doStart(){
 if(total()===50){s.screen='report';render(true);return;}
 let idx=MISSIONS.findIndex((m,i)=>done(i)<10);
 s.mission=idx<0?4:idx;
 const n=done(s.mission);
 if(n===0){s.q=0;s.selected=null;s.screen='theory'}
 else if(s.selected!==null && s.answers.some(a=>a.m===s.mission&&a.q===s.q)){s.screen='question'}
 else{s.q=n;s.selected=null;s.screen='question'}
 s.review=null;render(true);
}
function doAnswer(i){if(s.selected!==null||s.screen!=='question')return;const q=mission().questions[s.q];if(!q||!Number.isInteger(i)||i<0||i>2)return;s.selected=i;s.answers.push({m:s.mission,q:s.q,option:i});const good=q.correct===i;const delta=good?[3,3,2,3]:[-3,-2,-4,-3];s.scores=s.scores.map((v,j)=>cap(v+delta[j]));render(false);}
function toNext(){if(s.screen!=='question'||s.selected===null)return;s.selected=null;if(s.q<9){s.q++;s.screen='question'}else{s.screen='summary'}render(true)}
function afterTheory(){if(s.screen!=='theory'||s.review!==null)return;s.screen='brief';s.q=done(s.mission);s.selected=null;render(true)}
function nextMission(){if(s.screen!=='summary')return;if(s.mission===4){s.screen='report'}else{s.mission++;s.q=0;s.selected=null;s.screen='theory'}render(true)}
function navTo(i){if(i>s.mission)return;
 if(i<s.mission&&done(i)===10){s.review=i;s.screen='theory';render(true);return}
 s.review=null;s.mission=i;
 const n=done(i);
 if(n===10){s.screen='summary';s.q=9;s.selected=null}
 else if(n===0){s.screen='theory';s.q=0;s.selected=null}
 else{s.screen='question';s.q=n;s.selected=null}
 render(true);
}
function stopReview(){s.review=null;
 if(total()===50){s.screen='report'}
 else{let idx=MISSIONS.findIndex((m,i)=>done(i)<10);s.mission=idx;s.q=done(idx);s.selected=null;s.screen=s.q?'question':'theory'}
 render(true);
}
function reviewCurrent(){if(s.screen!=='summary')return;s.review=s.mission;s.screen='theory';render(true)}
document.addEventListener('click',(e)=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.lang){s.lang=b.dataset.lang;render(false);return}let action=b.dataset.action;if(!action)return;let idx=Number(b.dataset.i);if(action==='reset'){reset()}else if(action==='start'){doStart()}else if(action==='home'){s.screen='home';s.review=null;render(true)}else if(action==='begin'){s.screen='question';s.q=done(s.mission);s.selected=null;render(true)}else if(action==='answer'){doAnswer(idx)}else if(action==='next-question'){toNext()}else if(action==='goto-summary'){s.screen='summary';render(true)}else if(action==='after-theory'){afterTheory()}else if(action==='next-mission'){nextMission()}else if(action==='review-current'){reviewCurrent()}else if(action==='nav'){navTo(idx)}else if(action==='review'){s.review=idx;s.screen='theory';render(true)}else if(action==='end-review'){stopReview()}else if(action==='print'){window.print()}});
// Recover consistently on reload if a partial answer was selected.
if(s.screen==='question'&&s.selected===null&&s.q<10&&s.answers.some(a=>a.m===s.mission&&a.q===s.q)){s.q=done(s.mission)-1;s.selected=s.answers.find(a=>a.m===s.mission&&a.q===s.q)?.option??null;}
render();

</script></body></html>
